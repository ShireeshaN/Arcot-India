<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Animation Gallery  
   

  </title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow-x: hidden;
    }

    section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Gallery Section */
    .gallery-section {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .gallery {
      display: flex;
      align-items: center;
      gap: 30px;
      position: relative;
      z-index: 2;
    }

    .gallery img {
      object-fit: cover;
      /* border-radius: 12px; */
      transition: all 0.5s ease;
      opacity: 1;
    }

    /* Heights decrease outward */
    .gallery img.outer {
      height: 280px;
      width: 180px;
    }

    .gallery img.mid {
      height: 380px;
      width: 250px;
    }

    .gallery img.center {
      height: 500px;
      width: 390px;
      z-index: 5;
    }

    /* Banner Text */
    .banner-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Intro Section -->
  <section style="background:#222;">
    <h1>Scroll Down 👇</h1>
  </section>

  <!-- Gallery Section -->
  <section class="gallery-section">
    <div class="gallery">
      <img src="img/energy/wind2.webp" class="outer">
      <img src="img/energy/wind2.webp" class="mid">
      <img src="img/energy/wind2.webp" class="center">
      <img src="img/energy/wind2.webp" class="mid">
      <img src="img/energy/wind2.webp" class="outer">
    </div>
    <div class="banner-text">King Lumi - About</div>
  </section>

  <!-- Next Section -->
  <section style="background:#333;">
    <h1>Next Section 🚀</h1>
  </section>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Animation timeline
    let tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".gallery-section",
        start: "top top",
        end: "+=200%", // longer scroll to keep banner fixed
        scrub: true,
        pin: true
      }
    });

    // Phase 1 → enter: side images disappear, center expands
    tl.to(".gallery img.outer", {x: -400, opacity: 0, duration: 1}, 0);
    tl.to(".gallery img.mid:first-of-type", {x: -200, opacity: 0, duration: 1}, 0);
    tl.to(".gallery img.mid:last-of-type", {x: 200, opacity: 0, duration: 1}, 0);
    tl.to(".gallery img.outer:last-of-type", {x: 400, opacity: 0, duration: 1}, 0);

    tl.to(".gallery img.center", {
      width: "100vw",
      height: "100vh",
      duration: 1
    }, 0);

    tl.to(".banner-text", {opacity: 1, y: -50, duration: 1}, 0.5);

    // Phase 2 → exit: when leaving section, shrink back & restore side images
    tl.to(".banner-text", {opacity: 0, y: 0, duration: 1}, "exit");
    tl.to(".gallery img.center", {
      width: "220px",
      height: "500px",
      duration: 1
    }, "exit");
    tl.to(".gallery img.outer", {x: 0, opacity: 1, duration: 1}, "exit");
    tl.to(".gallery img.mid", {x: 0, opacity: 1, duration: 1}, "exit");
  </script>

</body>
</html>
