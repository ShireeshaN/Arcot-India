<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transmission Line Highlights</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }
    .banner {
      position: relative;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
    }
    .banner img {
      width: 100%;
      height: 100vh;
      display: block;
    }
    .highlight {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #090909;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px #fff;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .highlight:hover {
      transform: scale(1.5);
    }
    .label {
      position: absolute;
      color: #080707;
      background: none;
      padding: 0;
      font-size: 14px;
      white-space: nowrap;
      display: none;
    }
    .highlight:hover + .label {
      display: block;
    }
    /* Animation */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .highlight {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>

<div class="banner">
  <img src="img/transmission-lines/image.jpeg" alt="Transmission Line">
  
  <!-- Example Highlight Dot -->
  <div class="highlight" style="top: 27%; left: 35%;"></div>
  <div class="label" style="top: 29%; left: 37%;">Insulators</div>
  
  <div class="highlight" style="top: 40%; left: 25%;"></div>
  <div class="label" style="top: 43%; left: 27%;">Conductors</div>
  
  <div class="highlight" style="top: 42%; left: 48%;"></div>
  <div class="label" style="top: 42%; left: 50%;">Cross Arms</div>
  
  <div class="highlight" style="top: 30%; left: 47%;"></div>
  <div class="label" style="top: 33%; left: 49%;">Suspension Clamps</div>
  
  <div class="highlight" style="top: 5%; right: 58%;"></div>
  <div class="label" style="top: 5%; right: 60%;">Earth Wire</div>
  
  <div class="highlight" style="top: 24%; left: 52%;"></div>
  <div class="label" style="top: 26%; left: 54%;">Damper</div>
  
  <div class="highlight" style="top: 60%; left: 40%;"></div>
  <div class="label" style="top: 63%; left: 42%;">Tower</div>
  
  <div class="highlight" style="top: 45%; left: 46%;"></div>
  <div class="label" style="top: 48%; left: 48%;">Number of Discs</div>
</div>

</body>
</html>
