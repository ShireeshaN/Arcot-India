<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Commercial Lighting</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
    }

    /* Section container */
    .lighting-section {
      padding: 40px 60px;
    }

    /* Title */
    .lighting-section h2 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* Image row */
    .lighting-images {
      display: flex;
      gap: 20px;
    }

    .lighting-images img {
      width: 100%;
      max-width: 450px;
      height: auto;
      border-radius: 4px;
      object-fit: cover;
    }

    /* Bottom grey strip */
    .divider {
      margin-top: 40px;
      height: 60px;
      background: #ece6e2; /* light grey shade */
      width: 100%;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .lighting-section {
        padding: 20px;
      }
      .lighting-images {
        flex-direction: column;
        align-items: center;
      }
      .lighting-section h2 {
        font-size: 28px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <section class="lighting-section">
    <h2>Office lighting</h2>
    <div class="lighting-images">
      <img src="img/application/72.webp" alt="Office lighting sample 1">
      <img src="img/application/72.webp" alt="Office lighting sample 2">
    </div>
    <div class="divider"></div>
  </section>

</body>
</html>
