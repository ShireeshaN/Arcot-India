<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Image Accordion Slider</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .accordion {
      display: flex;
      width: 90%;
      max-width: 1200px;
      height: 400px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .accordion-item {
      flex: 1;
      transition: flex 0.5s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .accordion-item img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Ensures full image is visible */
      transition: transform 0.5s ease;
    }

    .accordion-item:hover {
      flex: 5;
    }

    .accordion-item:hover img {
      transform: scale(1.05); /* Slight zoom effect */
    }

    .accordion-item span {
      position: absolute;
      bottom: 15px;
      left: 15px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .accordion-item:hover span {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="accordion">
    <div class="accordion-item">
      <img src="https://picsum.photos/id/1015/800/600" alt="Mountain View">
      <span>Mountain View</span>
    </div>
    <div class="accordion-item">
      <img src="https://picsum.photos/id/1016/800/600" alt="Forest">
      <span>Forest</span>
    </div>
    <div class="accordion-item">
      <img src="https://picsum.photos/id/1018/800/600" alt="Lake">
      <span>Lake</span>
    </div>
    <div class="accordion-item">
      <img src="https://picsum.photos/id/1020/800/600" alt="Desert">
      <span>Desert</span>
    </div>
    <div class="accordion-item">
      <img src="https://picsum.photos/id/1024/800/600" alt="Beach">
      <span>Beach</span>
    </div>
  </div>

</body>
</html>
