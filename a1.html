<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neue White Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #333;
      overflow: hidden;
      background-color: #fff;
    }

    /* ===== LAYOUT CONTAINER ===== */
    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ===== LEFT PANEL ===== */
 .left-panel {
  flex: 1;
  max-width: 30%; /* keeps left compact */
  background: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 100px;
  position: relative;
  z-index: 10;
}

    .content-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .content-text p {
      font-size:18px;
      line-height: 3;
      text-transform: lowercase;
      letter-spacing: 1px;
      margin: 0.5rem 0;
      transition: color 0.3s, transform 0.3s;
      cursor: pointer;
        text-transform: uppercase;
    }

    .content-text p:hover {
      transform: translateX(8px);
      color: #9a623a;
    }

    .content-text .highlight {
      color: #9a623a;
      font-weight: bold;
    }

    /* ===== RIGHT PANEL (IMAGE AREA) ===== */
.right-panel {
  position: relative;
  width: 70%; /* wider image area */
  height: 100vh;
  overflow: hidden;
}
.background {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;        /* fills entire panel */
  background-position: center center;
  background-repeat: no-repeat;
  transition: opacity 1s ease-in-out;
  opacity: 1;
}
.background.hidden {
  opacity: 0;
}


    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 80px;
      height: 100vh;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border-right: 1px solid rgba(230, 230, 230, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 0;
      z-index: 20;
  
    }

    .logo {
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .nav-dots {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      gap: 10px;
    }

    .nav-dots .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bbb;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }

    .nav-dots .dot.active {
      background: #333;
      transform: scale(1.3);
    }

    .about-link {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 0.8rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

 @media (max-width: 992px) {

  html, body {
    overflow-x: hidden;
    overflow-y: auto;
    height: auto;
    margin: 0;
    padding: 0;
  }

  /* === MAIN LAYOUT === */
  .layout {
    flex-direction: column-reverse; /* Image first, then text */
    width: 100%;
    height: auto;
  }

  /* === IMAGE PANEL (TOP, 50% HEIGHT) === */
  .right-panel {
    order: -1;
    width: 100%;
    height: 40vh; /* Half of screen height */
    position: relative;
    overflow: hidden;
  }

  .background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;              /* ensures full coverage */
    background-size: cover;         /* fills full width and height */
    background-position: center;    /* perfectly centered */
    background-repeat: no-repeat;
    transition: opacity 1s ease-in-out;
  }

  /* === TEXT STRIP BELOW IMAGE === */
  .left-panel {
    width: 100%;
    max-width: 100%;
    background-color: #fff;
    padding: 1rem 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .content-text {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 2rem;
    width: 100%;
    padding: 0 1rem;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .content-text::-webkit-scrollbar {
    display: none;
  }

  .content-text p {
    flex: 0 0 auto;
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0;
    color: #333;
    cursor: pointer;
    scroll-snap-align: center;
    transition: transform 0.3s, color 0.3s;
  }

  .content-text p:hover,
  .content-text .highlight {
    color: #9a623a;
    transform: scale(1.1);
  }

  /* === HIDE SIDEBAR ON MOBILE === */
  .sidebar {
    display: none;
  }
}

  </style>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">A R C</div>

    <div class="nav-dots" id="navDots">
      <div class="dot active" data-index="0"></div>
      <div class="dot" data-index="1"></div>
      <div class="dot" data-index="2"></div>
      <div class="dot" data-index="3"></div>
      <div class="dot" data-index="4"></div>
      <div class="dot" data-index="5"></div>
      <div class="dot" data-index="6"></div>
      <div class="dot" data-index="7"></div>
    </div>

    <div class="about-link">WE ARE</div>
  </div>

  <!-- Main Layout -->
  <div class="layout">
    <!-- LEFT -->
    <div class="left-panel">
      <div class="content-text">
         <p data-bg="../img/lighting/lightingsecthree/5.png">Illuminate</p>
        <p data-bg="../img/lighting/lightingsecthree/6.png">Radiate</p>
        <p data-bg="../img/lighting/lightingsecthree/7.png">Luminate</p>
       
        <p class="highlight" data-bg="../img/lighting/lightingsecthree/1.png">Glow</p>
        <p data-bg="../img/lighting/lightingsecthree/2.png">Dazzle</p>
        <p data-bg="../img/lighting/lightingsecthree/3.png">Luminate</p>
        <p data-bg="../img/lighting/lightingsecthree/4.png">Gleam</p>
       
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <div class="background" id="bg1" style="background-image: url('../img/lighting/lightingsecthree/1.png');"></div>
      <div class="background hidden" id="bg2"></div>
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.content-text p');
    const dots = document.querySelectorAll('.nav-dots .dot');
    const bg1 = document.getElementById('bg1');
    const bg2 = document.getElementById('bg2');
    let showingBg1 = true;
    let currentIndex = 0;
    let autoChange;

    function changeBackground(index) {
      const p = items[index];
      const newBg = p.getAttribute('data-bg');
      const activeBg = showingBg1 ? bg1 : bg2;
      const hiddenBg = showingBg1 ? bg2 : bg1;

      items.forEach(el => el.classList.remove('highlight'));
      dots.forEach(el => el.classList.remove('active'));

      p.classList.add('highlight');
      dots[index].classList.add('active');

      const img = new Image();
      img.src = newBg;
      img.onload = () => {
        hiddenBg.style.backgroundImage = `url('${newBg}')`;
        hiddenBg.classList.remove('hidden');
        activeBg.classList.add('hidden');
        showingBg1 = !showingBg1;
      };
    }

    function handleClick(i) {
      currentIndex = i;
      changeBackground(currentIndex);
      resetAutoChange();
    }

    items.forEach((p, i) => p.addEventListener('click', () => handleClick(i)));
    dots.forEach((dot, i) => dot.addEventListener('click', () => handleClick(i)));

    function startAutoChange() {
      autoChange = setInterval(() => {
        currentIndex = (currentIndex + 1) % items.length;
        changeBackground(currentIndex);
      }, 3000);
    }

    function resetAutoChange() {
      clearInterval(autoChange);
      startAutoChange();
    }

    startAutoChange();
  </script>
</body>
</html>
