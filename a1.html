<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Listing Page</title>
<style>
/* ORIGINAL CSS KEPT EXACTLY SAME – NO DESIGN CHANGES */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
}
.container {
    display: flex;
    flex: 1;
    overflow: hidden;
}
.sidebar {
    width: 260px;
    background: #222;
    color: white;
    overflow-y: auto;
    padding: 20px 0;
}
.sidebar h2 {
    padding-left: 20px;
    margin-bottom: 10px;
}
.category ul {
    list-style: none;
    padding-left: 0;
}
.category > ul > li {
    border-bottom: 1px solid #444;
}
.category button {
    width: 100%;
    padding: 12px 20px;
    background: none;
    border: none;
    color: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}
.category button.open {
    background: #333;
}
.category ul ul {
    display: none;
    background: #333;
}
.category ul ul.show {
    display: block;
}
.category ul ul li a {
    display: block;
    padding: 10px 40px;
    color: #ddd;
    text-decoration: none;
}
.category ul ul li a:hover {
    background: #444;
}
.main-content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    background: #f4f4f4;
}
.product-listing {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}
.product-card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
}
.product-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 5px;
}
#noResults {
    display: none;
    text-align: center;
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>Categories</h2>
        <div class="category">
            <ul>
                <li>
                    <button onclick="toggleMenu(this)" data-filter-key="category" data-filter-value="cob">COB Lights</button>
                    <ul>
                        <li><a href="#" onclick="filterSub('type','spot')">COB Spot Lights</a></li>
                        <li><a href="#" onclick="filterSub('type','trimless')">Trimless COBs</a></li>
                        <li><a href="#" onclick="filterSub('type','concealed')">Concealed COBs</a></li>
                    </ul>
                </li>

                <li>
                    <button onclick="toggleMenu(this)">Profile Lights</button>
                    <ul>
                        <li><a href="#">Slim Profiles</a></li>
                        <li><a href="#">Deep Profiles</a></li>
                    </ul>
                </li>

                <li>
                    <button onclick="toggleMenu(this)">Led Strips</button>
                    <ul>
                        <li><a href="#">COB Strips</a></li>
                        <li><a href="#">SMD Strips</a></li>
                    </ul>
                </li>

            </ul>
        </div>
    </div>

    <div class="main-content">
        <div class="product-listing" id="productGrid">

            <!-- COB PRODUCTS -->
            <div class="product-card" data-category="cob" data-type="spot">
                <img src="images/spot1.jpg">
                <p>Spot COB – Model A</p>
            </div>

            <div class="product-card" data-category="cob" data-type="trimless">
                <img src="images/trimless1.jpg">
                <p>Trimless COB – Model T1</p>
            </div>

            <div class="product-card" data-category="cob" data-type="concealed">
                <img src="images/concealed1.jpg">
                <p>Concealed COB – Model C1</p>
            </div>

            <div class="product-card" data-category="cob" data-type="trimless">
                <img src="images/trimless2.jpg">
                <p>Trimless COB – Model T2</p>
            </div>

        </div>

        <p id="noResults">No products found</p>
    </div>
</div>

<script>
// CLOSE OTHERS + OPEN SELECTED MENU
function toggleMenu(btn) {
    const buttons = document.querySelectorAll('.category > ul > li > button');

    buttons.forEach(b => {
        if (b !== btn) {
            b.classList.remove('open');
            const s = b.nextElementSibling;
            if (s) s.classList.remove('show');
        }
    });

    btn.classList.toggle('open');
    const submenu = btn.nextElementSibling;
    if (submenu) submenu.classList.toggle('show');

    // Filter logic
    const key = btn.dataset.filterKey;
    const val = btn.dataset.filterValue;

    if (key && val) filterProducts(key, val);
}

// MAIN FILTER FUNCTION
function filterProducts(key, value) {
    let cards = document.querySelectorAll('.product-card');
    let count = 0;

    cards.forEach(c => {
        const cardVal = c.dataset[key] || "";
        const match = cardVal.toLowerCase() === value.toLowerCase();
        c.style.display = match ? "flex" : "none";
        if (match) count++;
    });

    document.getElementById('noResults').style.display = count ? 'none':'block';
}

// SUBCATEGORY FILTER
function filterSub(key, val) {
    filterProducts(key, val);
}

// DEFAULT OPEN: COB LIGHTS
window.onload = () => {
    const cobButton = document.querySelector('button[data-filter-value="cob"]');
    cobButton.classList.add('open');
    cobButton.nextElementSibling.classList.add('show');
    filterProducts('category','cob');
}
</script>

</body>
</html>
