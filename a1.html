<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>COB Products — Arcot Industries</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Minimal styles to match your layout (kept same look & behavior) */
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f8f8;
      margin: 0;
    }

    .header {
      background: #fff;
      padding: 16px 24px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      height: 40px;
    }

    .lighting-wrapper {
      padding: 20px;
    }

    .top-filter-dropdowns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      background: #fff;
      padding: 12px;
      border: 1px solid #ddd;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 120px;
    }

    .filter-group select,
    .filter-group input {
      padding: 6px 8px;
      font-size: 14px;
    }

    .lighting-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .sidebar {
      width: 260px;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 20px;
      box-sizing: border-box;
    }

    .category {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .category li {
      margin-bottom: 8px;
    }

    .category button {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: none;
      background: none;
      padding: 8px;
      text-align: left;
      cursor: pointer;
      font-weight: 500;
    }

    .category button.active {
      background: #f1f5f6;
    }

    .submenu {
      margin-left: 12px;
      padding-left: 0;
      display: block;
      margin-top: 6px;
    }

    .submenu a {
      display: block;
      padding: 6px 8px;
      color: #444;
      text-decoration: none;
      font-size: 14px;
    }

    .product-section {
      flex: 1;
      padding: 10px 0;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 28px;
    }

    .product-card {
      background: #fff;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #e7e7e7;
      min-height: 220px;
    }

    .product-card img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    .product-card h3 {
      margin-top: 10px;
      font-size: 15px;
      text-align: center;
    }

    .reset-btn {
      padding: 7px 12px;
      border: 1px solid #999;
      background: none;
      cursor: pointer;
    }

    .search-input {
      width: 280px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .top-right {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .lighting-container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <a href="index.html"><img class="logo" src="img/logos.webp" alt="Logo"></a>
    <h4 style="margin:0">Lighting — COB Category</h4>
    <div class="top-right">
      <input id="searchBox" class="search-input" placeholder="Search products or models..."
        oninput="searchFilter(this.value)" />
      <button class="reset-btn" onclick="resetFilters()">Reset</button>
    </div>
  </div>

  <section class="lighting-wrapper container-fluid">
    <!-- Top Filters -->
    <div class="top-filter-dropdowns">
      <div class="filter-group">
        <label>Type</label>
        <select onchange="filterDropdown('type', this.value)">
          <option value="">All</option>
          <option value="indoor">Indoor</option>
          <option value="outdoor">Outdoor</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Mounting</label>
        <select onchange="filterDropdown('mount', this.value)">
          <option value="">All</option>
          <option value="concealed">Concealed</option>
          <option value="surface">Surface</option>
          <option value="pendant">Pendant</option>
          <option value="track-2-line">Track 2-Line</option>
          <option value="track-3-line">Track 3-Line</option>
          <option value="magnetic-48v">Magnetic 48V</option>
          <option value="recessed-ground">Recessed Ground</option>
          <option value="spike-mount">Spike Mount</option>
          <option value="bollard">Bollard</option>
          <option value="underwater">Underwater</option>
          <option value="flexible-suspended-track">Flexible Suspended Track</option>
        </select>
      </div>

      <div class="filter-group">
        <label>IP Rating</label>
        <select onchange="filterDropdown('ip', this.value)">
          <option value="">All</option>
          <option value="ip20">IP20</option>
          <option value="ip60">IP60</option>
          <option value="ip65">IP65</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Wattage</label>
        <select onchange="filterDropdown('watt', this.value)">
          <option value="">All</option>
          <option value="5w">5W</option>
          <option value="10w">10W</option>
          <option value="12w">12W</option>
          <option value="18w">18W</option>
          <option value="20w">20W</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Control</label>
        <select onchange="filterDropdown('control', this.value)">
          <option value="">All</option>
          <option value="dali">DALI</option>
          <option value="onoff">On/Off</option>
          <option value="0-10v">0-10V</option>
          <option value="triac">Triac</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Application</label>
        <select onchange="filterDropdown('app', this.value)">
          <option value="">All</option>
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
          <option value="hospitality">Hospitality</option>
          <option value="industrial">Industrial</option>
        </select>
      </div>

      <div class="filter-group">
        <label>CCT</label>
        <select onchange="filterDropdown('cct', this.value)">
          <option value="">All</option>
          <option value="2000k">2000K</option>
          <option value="3000k">3000K</option>
          <option value="3500k">3500K</option>
          <option value="4000k">4000K</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Body Color</label>
        <select onchange="filterDropdown('color', this.value)">
          <option value="">All</option>
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="gold">Gold</option>
        </select>
      </div>
    </div>

    <div class="lighting-container">
      <!-- Sidebar (Categories) -->
      <aside class="sidebar">
        <h4 style="margin-top:0">Categories</h4>
        <ul class="category">
          <li><button onclick="goCategory('all')">All</button></li>
          <li><button class="active" onclick="goCategory('cob')">COB Lights</button>
            <!-- OPEN submenu for COB -->
            <ul class="submenu">
              <!-- These submenu items are the model groups; clicking a model could scroll/open details or filter by model name -->
              <a href="#" onclick="filterAttribute('model','cob-surface-10w'); return false;">COB Surface 10W</a>
              <a href="#" onclick="filterAttribute('model','cob-recessed-12w'); return false;">COB Recessed 12W</a>
              <a href="#" onclick="filterAttribute('model','cob-zoom-18w'); return false;">COB Zoom 18W</a>
              <a href="#" onclick="filterAttribute('model','cob-down-5w'); return false;">COB Downlight 5W</a>
              <a href="#" onclick="filterAttribute('model','cob-surface-20w'); return false;">COB Surface 20W</a>
            </ul>
          </li>

          <!-- Other main categories: link to their separate pages -->
          <li><button onclick="location.href='track-product.html'">Normal Track</button></li>
          <li><button onclick="location.href='magnetic-product.html'">Magnetic Track</button></li>
          <li><button onclick="location.href='slimtrack-product.html'">Slim Track</button></li>
          <li><button onclick="location.href='laserblades-product.html'">Laser Blades</button></li>
          <li><button onclick="location.href='panel-product.html'">Panel Lights</button></li>
          <li><button onclick="location.href='neonflex-product.html'">Neon Flex</button></li>
          <li><button onclick="location.href='hibay-product.html'">Hi-Bay</button></li>
          <li><button onclick="location.href='flood-product.html'">Flood Lights</button></li>
          <!-- add other links similarly -->
        </ul>
      </aside>

      <!-- Products -->
      <div class="product-section">
        <div class="product-grid" id="productGrid">

          <!-- NOTE: every product-card includes full data-* attributes used by filters -->
          <!-- Sample COB products (add more following same structure) -->
          <div class="product-card" data-category="cob" data-type="indoor" data-mount="surface" data-ip="ip20"
            data-watt="10w" data-control="onoff" data-app="residential" data-cct="3000k" data-color="black"
            data-model="cob-surface-10w" data-name="COB Surface 10W">
            <img src="img/lightingproducts/cobs/COB Spot Light/Adjustable _ Tiltable COB Spot Light.png" alt="COB Surface 10W">
            <h3>COB Surface 10W</h3>
          </div>

          <div class="product-card" data-category="cob" data-type="indoor" data-mount="recessed-ground" data-ip="ip20"
            data-watt="12w" data-control="dali" data-app="commercial" data-cct="4000k" data-color="white"
            data-model="cob-recessed-12w" data-name="COB Recessed 12W">
            <img src="img/lightingproducts/cobs/COB Spot Light/Adjustable _ Tiltable COB Spot Light.png" alt="COB Recessed 12W">
            <h3>COB Recessed 12W</h3>
          </div>

          <div class="product-card" data-category="cob" data-type="indoor" data-mount="ceiling" data-ip="ip20"
            data-watt="18w" data-control="0-10v" data-app="hospitality" data-cct="3500k" data-color="white"
            data-model="cob-zoom-18w" data-name="COB Zoom 18W">
            <img src="img/productsimgs/1.png" alt="COB Zoom 18W">
            <h3>COB Zoom 18W</h3>
          </div>

          <div class="product-card" data-category="cob" data-type="indoor" data-mount="ceiling" data-ip="ip20"
            data-watt="5w" data-control="onoff" data-app="residential" data-cct="3000k" data-color="gold"
            data-model="cob-down-5w" data-name="COB Downlight 5W">
            <img src="img/productsimgs/1.png" alt="COB Downlight 5W">
            <h3>COB Downlight 5W</h3>
          </div>

          <div class="product-card" data-category="cob" data-type="indoor" data-mount="surface" data-ip="ip60"
            data-watt="20w" data-control="triac" data-app="commercial" data-cct="4000k" data-color="black"
            data-model="cob-surface-20w" data-name="COB Surface 20W">
            <img src="img/productsimgs/1.png" alt="COB Surface 20W">
            <h3>COB Surface 20W</h3>
          </div>

          <!-- Add more COB models as required (keep same data-* attributes format) -->

        </div>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script>
    /********************************************************
     * Filtering engine for category page (COB)
     * - Works with data-* attributes on each .product-card
     * - Search will redirect if result belongs to another category
     ********************************************************/

    // GLOBAL DATA: mapping of a few sample products to their category pages
    // (used by search redirect) — extend this list for full site.
    const GLOBAL_PRODUCT_INDEX = [
      { name: "COB Surface 10W", category: "cob", page: "cobs-product.html" },
      { name: "COB Recessed 12W", category: "cob", page: "cobs-product.html" },
      { name: "COB Zoom 18W", category: "cob", page: "cobs-product.html" },
      { name: "Normal Track 12W", category: "track", page: "track-product.html" },
      { name: "Magnetic Track 20W", category: "magnetic", page: "magnetic-product.html" },
      { name: "Slim Track 15W", category: "slimtrack", page: "slimtrack-product.html" }
      // add all your catalog entries here for accurate cross-page search/redirect
    ];

    // Active filters & search state
    let activeFilters = {};
    let searchText = "";
    const currentPageCategory = "cob"; // this page's category

    // Called by selects
    function filterDropdown(attr, value) {
      if (!value || value === "") {
        delete activeFilters[attr];
      } else {
        activeFilters[attr] = value.toLowerCase();
      }
      applyFilters();
    }

    // Called by submenu model clicks
    function filterAttribute(attr, value) {
      if (activeFilters[attr] === value.toLowerCase()) {
        delete activeFilters[attr];
      } else {
        activeFilters[attr] = value.toLowerCase();
      }
      applyFilters();
    }

    // Search behavior:
    // - If search matches a product on current page -> filter locally
    // - If search matches a product on another category -> redirect to that category page
    function searchFilter(txt) {
      searchText = txt.trim().toLowerCase();

      if (searchText.length === 0) {
        applyFilters();
        return;
      }

      // try find exact or partial product match in GLOBAL_PRODUCT_INDEX
      let match = GLOBAL_PRODUCT_INDEX.find(p => p.name.toLowerCase().includes(searchText));
      if (match && match.page && match.category && match.category !== currentPageCategory) {
        // Redirect to product page for that category
        // NOTE: we use location.href so user moves to correct page
        window.location.href = match.page + "?q=" + encodeURIComponent(searchText);
        return;
      }

      // else apply local filtering (product cards)
      applyFilters();
    }

    // Reset button
    function resetFilters() {
      activeFilters = {};
      searchText = "";
      // reset selects
      document.querySelectorAll('.top-filter-dropdowns select').forEach(s => s.value = "");
      document.getElementById('searchBox').value = "";
      // reset submenu/active states (if any)
      // show all
      applyFilters();
    }

    // Apply combined filters + search to product cards
    function applyFilters() {
      const cards = document.querySelectorAll('.product-card');

      cards.forEach(card => {
        let show = true;

        // category check (this page is already COB so cards should be cob)
        const cardCategory = (card.dataset.category || "").toLowerCase();
        if (cardCategory !== currentPageCategory) {
          show = false; // safety — but in this page all should be cob
        }

        // attribute filters (AND across attributes)
        for (let key in activeFilters) {
          const fval = (activeFilters[key] || "").toLowerCase();
          const cardVal = (card.dataset[key] || "").toLowerCase();

          // If card has multiple values (comma separated) support OR semantics
          const cardVals = cardVal.split(',').map(v => v.trim()).filter(Boolean);

          if (cardVals.length === 0) {
            show = false; break;
          }

          if (!cardVals.includes(fval)) {
            show = false; break;
          }
        }

        // search text match: if searchText non-empty, require match in name/model/description
        if (show && searchText) {
          const hay = (card.dataset.name || "" + " " + card.innerText).toLowerCase();
          if (!hay.includes(searchText)) show = false;
        }

        card.style.display = show ? "flex" : "none";
      });
    }

    // Quick navigation when clicking category button in sidebar
    function goCategory(cat) {
      if (cat === 'all') {
        // if you have an 'all-products' page, navigate there; otherwise remove category filter
        location.href = 'all-products.html';
      } else {
        // navigate to category page (e.g., cob -> cobs-product.html)
        // mapping strategy: category-name + '-product.html'
        const page = cat + '-product.html';
        location.href = page;
      }
    }

    // On page load: open COB submenu and set active states
    (function init() {
      // ensure COB button is active in sidebar
      document.querySelectorAll('.category > li > button').forEach(btn => {
        if (btn.textContent.trim().toLowerCase().includes('cob')) {
          btn.classList.add('active');
        } else btn.classList.remove('active');
      });

      // If the page URL has ?q=... (redirected search), inject search and filter
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q');
      if (q) {
        document.getElementById('searchBox').value = q;
        searchText = q.toLowerCase();
      }

      // initial render
      applyFilters();
    })();

    // Optional: if you want counts or "no results" message, you can add here
  </script>
</body>

</html>
