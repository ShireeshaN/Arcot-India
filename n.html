<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cinematic Light Animation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
      font-family: sans-serif;
    }

    .scene {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    /* Wooden surface */
    .table {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(#5a3c1d, #3a240f);
      box-shadow: 0 -5px 20px rgba(0,0,0,0.8) inset;
    }

    /* Girl image */
    .girl {
      position: relative;
      z-index: 2;
      width: 250px;
      opacity: 0;
      transform: translateY(20px);
    }

    /* Light rays */
    .light-rays {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 120%;
      background: radial-gradient(ellipse at top, rgba(255,255,255,0.4) 0%, transparent 70%);
      opacity: 0;
      filter: blur(20px);
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* Warm glow overlay */
    .glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 20%, rgba(255,220,180,0.2), transparent 70%);
      opacity: 0;
      mix-blend-mode: screen;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="light-rays"></div>
    <div class="glow"></div>
    <!-- Replace girl.png with your own image/illustration -->
    <img src="img/sool1.jpg" alt="girl" class="girl"/>
    <div class="table"></div>
  </div>

  <script>
    // GSAP timeline for cinematic effect
    const tl = gsap.timeline({defaults:{ease:"power2.out"}});

    // Light fades in
    tl.to(".light-rays", {opacity:1, duration:2});
    tl.to(".girl", {opacity:1, y:0, duration:2}, "-=1.5"); // girl revealed
    tl.to(".glow", {opacity:1, duration:2}, "-=1.5");      // warm glow
    
    // Light intensifies slightly as she "smiles"
    tl.to(".light-rays", {opacity:1.3, scale:1.1, duration:2, transformOrigin:"center top"});
    tl.to(".glow", {opacity:0.6, duration:2}, "-=2");
  </script>
</body>
</html>
