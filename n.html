<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lighting Solutions Section</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body {
      background: #fff;
      color: #111;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin: 40px 0;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
    }

    .tab {
      position: relative;
      padding-bottom: 8px;
      color: #777;
    }

    .tab.active {
      color: #c00;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: #c00;
    }

    .slider-left {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      height: 350px;
      overflow: hidden;
      border-radius: 6px;
    }

    .slider-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dots-nav {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      color: #fff;
      font-size: 0.9rem;
      padding: 4px 0;
    }

    .dot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #fff;
    }

    .dot span {
      font-size: 0.85rem;
      white-space: nowrap;
    }

 .dot-indicator {
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ccc;
    transition:all 0.4s ease;  /* smooth transition */
    transform:scale(1);        /* default scale */
  }

  /* active dot transforms smoothly */
  .dot.active .dot-indicator {
    background:#c00;
    transform:scale(1.6);   /* enlarge smoothly */
  }

  /* add a subtle glow effect */
  .dot.active .dot-indicator {
    box-shadow:0 0 6px rgba(204,0,0,0.6);
  }

  /* optional hover effect */
  .dot:hover .dot-indicator {
    transform:scale(1.2);
  }

    @media(max-width:768px) {
      .slider-left {
        height: 250px;
      }

      .dot span {
        font-size: 0.75rem;
      }
    }
  </style>
</head>

<body>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="retail">Retail</div>
    <div class="tab" data-tab="supermarket">Supermarket</div>
    <div class="tab" data-tab="meeting">Meeting Room</div>
    <div class="tab" data-tab="hospitality">Hospitality</div>
    <div class="tab" data-tab="industrial">Industrial</div>
    <div class="tab" data-tab="outdoor">Outdoor</div>
    <div class="tab" data-tab="office">Office</div>
    <div class="tab" data-tab="residential">Residential</div>
  </div>

  <!-- Slider -->
  <div class="slider-left">
    <img id="slideImage" src="img/lighting/commerciallighting.png" alt="slide" />
    <div class="dots-nav" id="dotsNav"></div>
  </div>

  <script>
    const slidesData = {
      retail: [
        { img: 'img/lighting/outdoorlighting.png' },
        { img: 'img/lighting/commerciallighting.png' },
        { img: 'img/lighting/facadelighting.webp' },
        { img: 'img/lighting/hospitallighting.png' }
      ],
      supermarket: [
        { img: 'img/lighting/super1.jpg' },
        { img: 'img/lighting/super2.jpg' },
        { img: 'img/lighting/super3.jpg' },
        { img: 'img/lighting/super4.jpg' }
      ],
      meeting: [
        { img: 'img/lighting/meet1.jpg' },
        { img: 'img/lighting/meet2.jpg' },
        { img: 'img/lighting/meet3.jpg' },
        { img: 'img/lighting/meet4.jpg' }
      ],
      hospitality: [
        { img: 'img/lighting/hotel1.jpg' },
        { img: 'img/lighting/hotel2.jpg' },
        { img: 'img/lighting/hotel3.jpg' },
        { img: 'img/lighting/hotel4.jpg' }
      ],
      industrial: [
        { img: 'img/lighting/ind1.jpg' },
        { img: 'img/lighting/ind2.jpg' },
        { img: 'img/lighting/ind3.jpg' },
        { img: 'img/lighting/ind4.jpg' }
      ],
      outdoor: [
        { img: 'img/lighting/outdoor1.jpg' },
        { img: 'img/lighting/outdoor2.jpg' },
        { img: 'img/lighting/outdoor3.jpg' },
        { img: 'img/lighting/outdoor4.jpg' }
      ],
      office: [
        { img: 'img/lighting/office1.jpg' },
        { img: 'img/lighting/office2.jpg' },
        { img: 'img/lighting/office3.jpg' },
        { img: 'img/lighting/office4.jpg' }
      ],
      residential: [
        { img: 'img/lighting/res1.jpg' },
        { img: 'img/lighting/res2.jpg' },
        { img: 'img/lighting/res3.jpg' },
        { img: 'img/lighting/res4.jpg' }
      ]
    };

    const tabs = document.querySelectorAll('.tab');
    const slideImage = document.getElementById('slideImage');
    const dotsNav = document.getElementById('dotsNav');

    let currentTab = 'retail';
    let currentIndex = 0;
    let autoPlayTimer = null;
    const delay = 4000;

    function renderDots() {
      dotsNav.innerHTML = '';
      slidesData[currentTab].forEach((s, i) => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === currentIndex ? ' active' : '');
        dot.innerHTML = `<span>Slide ${i + 1}</span><div class="dot-indicator"></div>`;
        dot.addEventListener('click', () => {
          showSlide(i);
          resetAutoPlay();
        });
        dotsNav.appendChild(dot);
      });
    }

    function showSlide(idx) {
      currentIndex = idx;
      slideImage.src = slidesData[currentTab][idx].img;
      renderDots();
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slidesData[currentTab].length;
      showSlide(currentIndex);
    }

    function startAutoPlay() {
      stopAutoPlay();
      autoPlayTimer = setInterval(nextSlide, delay);
    }
    function stopAutoPlay() {
      if (autoPlayTimer) clearInterval(autoPlayTimer);
    }
    function resetAutoPlay() {
      startAutoPlay();
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        currentIndex = 0;
        showSlide(0);
        resetAutoPlay();
      });
    });

    // Init
    showSlide(0);
    startAutoPlay();
  </script>

</body>

</html>
