<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lighting Solutions</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: #fff;
    }

    .solutions-section {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* Background images */
    .solution-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .solution-bg.active {
      opacity: 1;
    }

    /* Left black gradient overlay */
    .solutions-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.85), rgba(0,0,0,0));
      z-index: 1;
      pointer-events: none;
    }

    /* Text menu */
    .solutions-menu {
      position: relative;
      z-index: 2;
      padding-left: 80px;
      text-align: left;
    }

    .solutions-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .solutions-menu ul li {
      font-size: 3rem;
      font-weight: 600;
      margin: 15px 0;
      color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      position: relative;
      transition: 
        color 0.8s ease,
        transform 0.8s ease,
        opacity 0.8s ease;
    }

    .solutions-menu ul li.active,
    .solutions-menu ul li:hover {
      color: #ffffff;
      transform: translateX(15px);
      opacity: 1;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .solutions-menu {
        padding-left: 40px;
      }
      .solutions-menu ul li {
        font-size: 2.5rem;
        margin: 12px 0;
      }
      .solutions-overlay {
        width: 50%;
      }
    }

    @media (max-width: 768px) {
      .solutions-menu {
        padding-left: 20px;
      }
      .solutions-menu ul li {
        font-size: 2rem;
        margin: 10px 0;
      }
      .solutions-overlay {
        width: 60%;
      }
    }

    @media (max-width: 480px) {
      .solutions-menu {
        padding-left: 15px;
      }
      .solutions-menu ul li {
        font-size: 1.5rem;
        margin: 8px 0;
      }
      .solutions-overlay {
        width: 70%;
      }
    }
  </style>
</head>
<body>

  <section class="solutions-section">
    <!-- Background images -->
    <div class="solution-bg active" style="background-image: url('img/17.png');"></div>
    <div class="solution-bg" style="background-image: url('img/10.png');"></div>
    <div class="solution-bg" style="background-image: url('img/11.png');"></div>
    <div class="solution-bg" style="background-image: url('img/12.png');"></div>
    <div class="solution-bg" style="background-image: url('img/20.png');"></div>
    <div class="solution-bg" style="background-image: url('img/19.png');"></div>

    <!-- Black gradient overlay -->
    <div class="solutions-overlay"></div>

    <!-- Menu -->
    <div class="solutions-menu">
      <ul>
        <li class="active" data-index="0">Indoor</li>
        <li data-index="1">Outdoor</li>
        <li data-index="2">Immersion</li>
        <li data-index="3">Linear system</li>
        <li data-index="4">Architectural</li>
        <li data-index="5">Decorative</li>
      </ul>
    </div>
  </section>

  <script>
    const menuItems = document.querySelectorAll(".solutions-menu ul li");
    const bgItems = document.querySelectorAll(".solution-bg");

    let currentIndex = 0;
    let autoPlay;

    function showSlide(index) {
      menuItems.forEach(li => li.classList.remove("active"));
      bgItems.forEach(bg => bg.classList.remove("active"));

      menuItems[index].classList.add("active");
      bgItems[index].classList.add("active");

      currentIndex = index;
    }

    menuItems.forEach(item => {
      item.addEventListener("mouseenter", () => {
        let index = parseInt(item.getAttribute("data-index"));
        showSlide(index);
        resetAutoPlay();
      });
    });

    function nextSlide() {
      let nextIndex = (currentIndex + 1) % bgItems.length;
      showSlide(nextIndex);
    }

    function startAutoPlay() {
      autoPlay = setInterval(nextSlide, 4000);
    }

    function resetAutoPlay() {
      clearInterval(autoPlay);
      startAutoPlay();
    }

    // Init
    showSlide(0);
    startAutoPlay();
  </script>

</body>
</html>
