<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lighting Solutions Section</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
    body{background:#fff;color:#111;}
    .tabs{
      display:flex;
      justify-content:center;
      gap:4rem;
      margin:40px 0;
      font-size:1.1rem;
      font-weight:500;
      cursor:pointer;
    }
    .tab{position:relative;padding-bottom:8px;color:#777;}
    .tab.active{color:#c00;}
    .tab.active::after{
      content:'';
      position:absolute;
      left:0;bottom:0;
      width:100%;height:2px;
      background:#c00;
    }

    /* Full-width slider */
    .slider-left{
      position:relative;
      width:100%;
      max-width:1200px;
      margin:0 auto;
      height:350px;                /* <<< reduced height */
      overflow:hidden;
      border-radius:6px;
    }
    .slider-left img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* dots navigation bottom */
    .dots-nav{
      position:absolute;
      bottom:15px;
      left:0;
      width:100%;
      display:flex;
      justify-content:space-evenly;
      align-items:center;
      color:#fff;
      font-size:0.9rem;

      padding:4px 0;
    }
    .dot{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      cursor:pointer;
      color:#fff;
    }
    .dot span{
      font-size:0.85rem;
      white-space:nowrap;
    }
    .dot-indicator{
      width:6px;height:6px;
      border-radius:50%;
      background:#ccc;
      transition:all .3s;
    }
    .dot.active .dot-indicator{
      background:#c00;
      width:8px;height:8px;
    }

    @media(max-width:768px){
      .slider-left{height:250px;}   /* smaller on mobile */
      .dot span{font-size:0.75rem;}
    }
  </style>
</head>
<body>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="retail">Retail</div>
    <div class="tab" data-tab="supermarket">Supermarket</div>
    <div class="tab" data-tab="meeting">Meeting Room</div>
  </div>

  <!-- Slider (full width image only) -->
  <div class="slider-left">
    <img id="slideImage" src="img/lighting/commerciallighting.png" alt="slide"/>
    <div class="dots-nav" id="dotsNav"></div>
  </div>

<script>
  const slidesData = {
    retail:[
      {img:'img/lighting/commerciallighting.png'},
      {img:'img/lighting/hospitallighting.png'},
      {img:'img/lighting/industriallighting.png'},
      {img:'img/lighting/outdoorlighting.png'}
    ],
    supermarket:[
      {img:'super1.jpg'},
      {img:'super2.jpg'},
      {img:'super3.jpg'},
      {img:'super4.jpg'}
    ],
    meeting:[
      {img:'meet1.jpg'},
      {img:'meet2.jpg'},
      {img:'meet3.jpg'},
      {img:'meet4.jpg'}
    ]
  };

  const tabs=document.querySelectorAll('.tab');
  const slideImage=document.getElementById('slideImage');
  const dotsNav=document.getElementById('dotsNav');

  let currentTab='retail';
  let currentIndex=0;
  let autoPlayTimer=null;
  const delay=4000; // 4 seconds

  function renderDots(){
    dotsNav.innerHTML='';
    slidesData[currentTab].forEach((s,i)=>{
      const dot=document.createElement('div');
      dot.className='dot'+(i===currentIndex?' active':'');
      dot.innerHTML=`<span>Slide ${i+1}</span><div class="dot-indicator"></div>`;
      dot.addEventListener('click',()=>{
        showSlide(i);
        resetAutoPlay();
      });
      dotsNav.appendChild(dot);
    });
  }

  function showSlide(idx){
    currentIndex=idx;
    slideImage.src=slidesData[currentTab][idx].img;
    renderDots();
  }

  function nextSlide(){
    currentIndex = (currentIndex + 1) % slidesData[currentTab].length;
    showSlide(currentIndex);
  }

  function startAutoPlay(){
    stopAutoPlay();
    autoPlayTimer = setInterval(nextSlide, delay);
  }
  function stopAutoPlay(){
    if(autoPlayTimer) clearInterval(autoPlayTimer);
  }
  function resetAutoPlay(){
    startAutoPlay();
  }

  tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentTab=tab.dataset.tab;
      currentIndex=0;
      showSlide(0);
      resetAutoPlay();
    });
  });

  // Init
  showSlide(0);
  startAutoPlay();
</script>

</body>
</html>
