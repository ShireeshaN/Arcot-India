<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart City Slider</title>
<style>
  :root{
    --bg:#f5f5f6;
    --text:#1a1a1a;
    --muted:#555;
    --accent:#111; 
  }

  body{
    margin:0;
    font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  .section{
    max-width:1200px;
    margin:0 auto;
    padding:60px 20px;
    position:relative;
  }

  .slide{
    display:grid;
    grid-template-columns: 55% 45%; 
    align-items:center;
    gap:30px;
    position:relative;
  }

  /* --- IMAGE --- */
  .media{
    height:340px;
    overflow:hidden;
    border-radius:14px;
    position:relative;
  }
  .media img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transform:translateX(80px) scale(1.05);
    transition:all 1s ease;
  }
  .media img.active{
    opacity:1;
    transform:translateX(0) scale(1);
  }

  /* --- TEXT --- */
  .copy{
    position:relative;
    padding-bottom:50px;
  }
  .title{
    font-size:30px;font-weight:800;margin:0 0 14px;
    opacity:0;transform:translateX(-80px);
    transition:all 1s ease;
  }
  .desc{
    font-size:17px;line-height:1.6;color:var(--muted);margin:0;
    opacity:0;transform:translateX(-80px);
    transition:all 1s ease;
  }
  .active-text .title,
  .active-text .desc{
    opacity:1;transform:translateX(0);
  }

  /* --- FUTURISTIC ICON INDICATOR --- */
  .indicator{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:25px;
  }
  .indicator span{
    font-size:14px;
    padding:6px 12px;
    border-radius:20px;
    background:#fff;
    border:1px solid #ccc;
    opacity:0.7;
    transition:all 0.4s;
  }
  .indicator span.active{
    background:var(--accent);
    color:#fff;
    opacity:1;
  }

  /* --- PROGRESS BAR --- */
  .progress-bar{
    height:3px;
    width:100%;
    background:#ddd;
    margin-top:14px;
    position:relative;
    overflow:hidden;
    border-radius:3px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width linear;
  }

  /* --- ARROWS --- */
  .arrows{
    position:absolute;
    left:55%;
    bottom:-80px;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
    justify-content:center;
  }
  .arrow{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.25s;
    border:2px solid var(--accent);
    color:var(--accent);
    background:#fff;
  }
  .arrow svg{width:20px;height:20px}
  .arrow:hover{background:var(--accent);color:#fff}

  /* Responsive */
  @media(max-width:992px){
    .slide{grid-template-columns:1fr;gap:20px;}
    .media{height:220px}
    .title{font-size:22px}
    .desc{font-size:15px}
    .indicator{flex-wrap:wrap}
    .arrows{flex-direction:row;bottom:-70px;}
  }
</style>
</head>
<body>

<section class="section">
  <div class="slide">
    <!-- Image -->
    <figure class="media">
      <img src="img/bannerabout.webp" alt="Smart Pole" class="active" id="img">
    </figure>

    <!-- Text -->
    <div class="copy active-text" id="text">
      <h3 class="title">Smart Pole</h3>
      <p class="desc">
        Multi-functional poles with EV charging, CCTV, Wi-Fi, SOS, LED displays, and sensors — delivering smarter, connected, safer cities.
      </p>
      <!-- Smart City Indicators -->
      <div class="indicator" id="indicator"></div>
      <!-- Progress Bar -->
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    </div>

    <!-- Arrows -->
    <div class="arrows">
      <button class="arrow prev" onclick="prev()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
      </button>
      <button class="arrow next" onclick="next()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
    </div>
  </div>
</section>

<script>
const slides = [
  {
    img: "img/bannerabout.webp",
    title: "Smart Pole",
    desc: "Multi-functional poles with EV charging, CCTV, Wi-Fi, SOS, LED displays, and sensors — delivering smarter, connected, safer cities.",
    icon: "Smart Pole"
  },
  {
    img: "img/carousel-1.webp",
    title: "Smart Bollard",
    desc: "Retractable or fixed bollards with lighting, traffic control, and surveillance for secure urban environments.",
    icon: "Bollard"
  }
  
];

let idx=0;
const img=document.getElementById("img");
const text=document.getElementById("text");
const progress=document.getElementById("progress");
const indicator=document.getElementById("indicator");

// create indicators
slides.forEach((s,i)=>{
  const span=document.createElement("span");
  span.textContent=s.icon;
  if(i===0) span.classList.add("active");
  indicator.appendChild(span);
});

function updateIndicators(){
  [...indicator.children].forEach((el,i)=>{
    el.classList.toggle("active", i===idx);
  });
}

function animateProgress(){
  progress.style.transition="none";
  progress.style.width="0%";
  setTimeout(()=>{
    progress.style.transition="width 5s linear";
    progress.style.width="100%";
  },50);
}

function show(i){
  idx=(i+slides.length)%slides.length;

  img.classList.remove("active");
  text.classList.remove("active-text");

  setTimeout(()=>{
    img.src=slides[idx].img;
    text.querySelector(".title").textContent=slides[idx].title;
    text.querySelector(".desc").textContent=slides[idx].desc;
    img.classList.add("active");
    text.classList.add("active-text");
    updateIndicators();
    animateProgress();
  },150); 
}

function next(){ show(idx+1); }
function prev(){ show(idx-1); }

// auto play
setInterval(()=> next(), 5000);
animateProgress();
</script>

</body>
</html>
