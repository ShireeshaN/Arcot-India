<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lighting Solutions Section</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #fff;
      color: #111;
    }

    /* Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin: 40px 0;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
    }

    .tab {
      position: relative;
      padding-bottom: 8px;
      color: #777;
      transition: color 0.3s ease;
    }

    .tab.active {
      color: #c00;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: #c00;
      transition: all 0.3s ease;
    }

    /* Slider */
    .slider-left {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto 50px auto;
      height: 500px; /* increased height */
      overflow: hidden;
    }

    .slider-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 1s ease, transform 0.8s ease;
    }

    .fade-in {
      opacity: 0;
      transform: scale(1.05);
      animation: fadeInAnim 0.8s forwards;
    }

    @keyframes fadeInAnim {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Dots navigation */
    .dots-nav {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 80%;
      max-width: 700px;
      color: #fff;
      font-size: 0.9rem;
    }

    .dots-nav::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-50%);
      z-index: 0;
    }

    .dot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      cursor: pointer;
      gap: 6px;
      transition: transform 0.3s ease;
    }

    .dot:hover {
      transform: scale(1.1);
    }

    .dot-indicator {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #111;
      transition: all 0.3s ease;
    }

    .dot.active .dot-indicator {
      background: #c00;
      border-color: #c00;
      transform: scale(1.3);
      box-shadow: 0 0 15px rgba(204, 0, 0, 0.8);
    }

    .dot span {
      font-size: 0.75rem;
      white-space: nowrap;
      margin-top: 6px;
    }

    @media (max-width: 768px) {
      .slider-left {
        height: 300px;
      }

      .dots-nav {
        width: 90%;
        max-width: 500px;
      }

      .dot-indicator {
        width: 12px;
        height: 12px;
      }

      .dot span {
        font-size: 0.65rem;
      }
    }
  </style>
</head>

<body>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="retail">
Residential </div>
    <div class="tab" data-tab="supermarket">Facade </div>
    <div class="tab" data-tab="meeting">Commercial </div>
    <div class="tab" data-tab="hospitality">Industrial </div>
    <div class="tab" data-tab="industrial">Hospitality </div>
    <div class="tab" data-tab="outdoor">Stadium </div>
    <div class="tab" data-tab="office">Office</div>
    <div class="tab" data-tab="residential">Outdoor</div>
  </div>

  <!-- Slider -->
  <div class="slider-left">
    <img id="slideImage" src="img/lighting/commerciallighting.png" alt="slide" />
    <div class="dots-nav" id="dotsNav"></div>
  </div>

  <script>
    const slidesData = {
      retail: [
        { img: 'img/ssd.png' },
        { img: 'img/ssd1.png' },
        { img: 'img/ssd1.png' },
        { img: 'img/lighting/hospitallighting.png' }
      ],
      supermarket: [
        { img: 'img/lighting/super1.jpg' },
        { img: 'img/lighting/super2.jpg' },
        { img: 'img/lighting/super3.jpg' },
        { img: 'img/lighting/super4.jpg' }
      ],
      meeting: [
        { img: 'img/lighting/meet1.jpg' },
        { img: 'img/lighting/meet2.jpg' },
        { img: 'img/lighting/meet3.jpg' },
        { img: 'img/lighting/meet4.jpg' }
      ],
      hospitality: [
        { img: 'img/lighting/hotel1.jpg' },
        { img: 'img/lighting/hotel2.jpg' },
        { img: 'img/lighting/hotel3.jpg' },
        { img: 'img/lighting/hotel4.jpg' }
      ],
      industrial: [
        { img: 'img/lighting/ind1.jpg' },
        { img: 'img/lighting/ind2.jpg' },
        { img: 'img/lighting/ind3.jpg' },
        { img: 'img/lighting/ind4.jpg' }
      ],
      outdoor: [
        { img: 'img/lighting/outdoor1.jpg' },
        { img: 'img/lighting/outdoor2.jpg' },
        { img: 'img/lighting/outdoor3.jpg' },
        { img: 'img/lighting/outdoor4.jpg' }
      ],
      office: [
        { img: 'img/lighting/office1.jpg' },
        { img: 'img/lighting/office2.jpg' },
        { img: 'img/lighting/office3.jpg' },
        { img: 'img/lighting/office4.jpg' }
      ],
      residential: [
        { img: 'img/lighting/res1.jpg' },
        { img: 'img/lighting/res2.jpg' },
        { img: 'img/lighting/res3.jpg' },
        { img: 'img/lighting/res4.jpg' }
      ]
    };

    const tabs = document.querySelectorAll('.tab');
    const slideImage = document.getElementById('slideImage');
    const dotsNav = document.getElementById('dotsNav');

    let currentTab = 'retail';
    let currentIndex = 0;
    let autoPlayTimer = null;
    const delay = 4000;

    function renderDots() {
      dotsNav.innerHTML = '';
      slidesData[currentTab].forEach((s, i) => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === currentIndex ? ' active' : '');
        dot.innerHTML = `<div class="dot-indicator"></div><span>Slide ${i + 1}</span>`;
        dot.addEventListener('click', () => {
          showSlide(i);
          resetAutoPlay();
        });
        dotsNav.appendChild(dot);
      });
    }

    function showSlide(idx) {
      currentIndex = idx;
      slideImage.classList.remove('fade-in');
      void slideImage.offsetWidth; // trigger reflow
      slideImage.src = slidesData[currentTab][idx].img;
      slideImage.classList.add('fade-in');
      renderDots();
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slidesData[currentTab].length;
      showSlide(currentIndex);
    }

    function startAutoPlay() {
      stopAutoPlay();
      autoPlayTimer = setInterval(nextSlide, delay);
    }
    function stopAutoPlay() {
      if (autoPlayTimer) clearInterval(autoPlayTimer);
    }
    function resetAutoPlay() {
      startAutoPlay();
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        currentIndex = 0;
        showSlide(0);
        resetAutoPlay();
      });
    });

    // Init
    showSlide(0);
    startAutoPlay();
  </script>

</body>

</html>
