<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartPole Main Slider</title>

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: #fff;
  color: #111;
  overflow-x: hidden;
}

/* Container */
.smartpole-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100vh;
  padding: 0 60px;
  box-sizing: border-box;
  position: relative;
}

/* Text box */
.smartpole-text {
  width: 45%;
  position: relative;
}

.smartpole-text h5 {
  font-size: 14px;
  text-transform: uppercase;
  font-weight: 400;
  margin-bottom: 10px;
  letter-spacing: 0.05em;
  position: relative;
}

.smartpole-text h5::after {
  content: "";
  display: block;
  width: 350px;
  height: 1px;
  background: #000;
  margin-top: 8px;
}

.smartpole-text h2 {
  font-size: 26px;
  text-transform: uppercase;
  margin: 20px 0;
  font-weight: 700;
}

.smartpole-text p {
  font-size: 14px;
  line-height: 1.7;
  color: #333;
  margin-bottom: 15px;
}

/* Bullet points */
.smartpole-text ul {
  margin: 0;
  padding-left: 20px;
  list-style-type: disc;
}

.smartpole-text ul li {
  font-size: 14px;
  margin-bottom: 8px;
  color: #333;
}

/* bottom line */
.smartpole-text::after {
  content: "";
  display: block;
  width: 80%;
  height: 1px;
  background: #000;
  margin-top: 50px;
}

/* Image container */
.smartpole-image {
  width: 50%;
  overflow: hidden;
  position: relative;
  height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.smartpole-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
  transition: transform 0.8s ease-in-out;
}

.smartpole-image:hover img {
  transform: scale(1.03);
}

/* Navigation buttons */
.nav-btn {
  background: transparent;
  color: #000;
  border: none;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 32px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: transform 0.3s ease;
}

.nav-btn:hover {
  transform: scale(1.2);
  color: #ffcc00;
}

/* Desktop positions */
#prevBtn { left: 380px; top: 90%; position: absolute; transform: translateY(-50%); }
#nextBtn { right: 800px; top: 90%; position: absolute; transform: translateY(-50%); }

/* Dots navigation */
.dots {
  position: absolute;
  bottom: 60px;
  left: 35%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

.dots span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #111;
  opacity: 0.4;
  cursor: pointer;
  transition: 0.3s;
}

.dots span.active {
  opacity: 1;
  background: #000;
}

/* Mobile adjustments */
@media (max-width: 768px) {
  .smartpole-section {
    flex-direction: column;
    align-items: center;
    padding: 20px;
    height: auto;
  }

  .smartpole-image {
    width: 100%;
    height: 300px;
    margin-bottom: 20px;
  }

  .smartpole-text {
    width: 100%;
    margin-top: 0;
    text-align: left;
  }

  .smartpole-text h5::after,
  .smartpole-text::after {
    width: 100%;
    margin-top: 15px;
  }

  .nav-buttons-wrapper {
    display: flex;
    justify-content: center;
    gap: 100px;
    margin: 15px 0;
    width: 100%;
  }

  #prevBtn, #nextBtn {
    position: static;
    transform: none;
    width: 50px;
    height: 50px;
    font-size: 28px;
  }

  .dots {
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 10px;
  }
}
</style>
</head>

<body>
<section class="smartpole-section">

  <div class="smartpole-text" id="smartpoleText">
    <h5>Main Feature</h5>
    <h2>Smart Lighting</h2>
    <p>
      AI-powered adaptive street lighting that adjusts brightness automatically 
      based on movement and environmental conditions for energy efficiency.
    </p>
    <ul>
      <li>Energy efficient</li>
      <li>AI-powered</li>
      <li>Real-time monitoring</li>
    </ul>
  </div>

  <div class="smartpole-image">
    <img id="smartpoleImage" src="https://images.unsplash.com/photo-1581091870633-7ccfa0f3c3b3?auto=format&fit=crop&w=1000&q=80" alt="SmartPole Image">
  </div>

  <!-- Mobile buttons wrapper -->
  <div class="nav-buttons-wrapper">
    <button class="nav-btn" id="prevBtn">&#8592;</button>
    <button class="nav-btn" id="nextBtn">&#8594;</button>
  </div>

  <div class="dots" id="smartpoleDots"></div>
</section>

<script>
const smartpoleMain = [
  {
    title: "Smart Lighting",
    desc: "AI-powered adaptive street lighting that adjusts brightness automatically based on movement and environmental conditions for energy efficiency.",
    points: ["Energy efficient", "AI-powered", "Real-time monitoring"],
    img: "https://images.unsplash.com/photo-1581091870633-7ccfa0f3c3b3?auto=format&fit=crop&w=1000&q=80"
  },
  {
    title: "Environmental Monitoring",
    desc: "Tracks air quality, temperature, humidity, and noise levels in real time for smart city applications.",
    points: ["Air quality tracking", "Temperature & humidity sensors", "Noise monitoring"],
    img: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1000&q=80"
  },
  {
    title: "Traffic Analytics",
    desc: "Uses AI-based video analytics to monitor vehicle flow, detect congestion, and improve traffic management.",
    points: ["Vehicle flow monitoring", "Congestion detection", "Traffic optimization"],
    img: "https://images.unsplash.com/photo-1517949908112-7201cc1261c7?auto=format&fit=crop&w=1000&q=80"
  },
  {
    title: "Public Wi-Fi Hotspot",
    desc: "Integrated Wi-Fi access points provide connectivity for citizens and IoT devices in smart cities.",
    points: ["Citizen connectivity", "IoT integration", "High-speed access"],
    img: "https://images.unsplash.com/photo-1504386106331-3e4e71712b38?auto=format&fit=crop&w=1000&q=80"
  }
];

let spIndex = 0;
const spImgEl = document.getElementById("smartpoleImage");
const spTextEl = document.getElementById("smartpoleText");
const spDotsEl = document.getElementById("smartpoleDots");

function updateSmartPole() {
  const item = smartpoleMain[spIndex];
  spImgEl.src = item.img;

  let pointsHTML = "<ul>";
  item.points.forEach(pt => pointsHTML += `<li>${pt}</li>`);
  pointsHTML += "</ul>";

  spTextEl.innerHTML = `
    <h5>Main Feature</h5>
    <h2>${item.title}</h2>
    <p>${item.desc}</p>
    ${pointsHTML}
  `;

  document.querySelectorAll("#smartpoleDots span").forEach((dot, i) => {
    dot.classList.toggle("active", i === spIndex);
  });
}

// Initialize dots
smartpoleMain.forEach((_, i) => {
  const dot = document.createElement("span");
  dot.addEventListener("click", () => {
    spIndex = i;
    updateSmartPole();
  });
  spDotsEl.appendChild(dot);
});

// Navigation
document.getElementById("nextBtn").onclick = () => {
  spIndex = (spIndex + 1) % smartpoleMain.length;
  updateSmartPole();
};

document.getElementById("prevBtn").onclick = () => {
  spIndex = (spIndex - 1 + smartpoleMain.length) % smartpoleMain.length;
  updateSmartPole();
};

// Auto-scroll
let autoScroll = setInterval(() => {
  spIndex = (spIndex + 1) % smartpoleMain.length;
  updateSmartPole();
}, 3500);

document.querySelector(".smartpole-section").addEventListener("mouseenter", () => {
  clearInterval(autoScroll);
});

document.querySelector(".smartpole-section").addEventListener("mouseleave", () => {
  autoScroll = setInterval(() => {
    spIndex = (spIndex + 1) % smartpoleMain.length;
    updateSmartPole();
  }, 3500);
});

updateSmartPole();
</script>
</body>
</html>
