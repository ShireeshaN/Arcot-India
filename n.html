<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lighting Slider – Arcot Style</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body {
    font-family: 'Poppins', sans-serif;
    background: #000;
    overflow-x: hidden;
  }

  /* ===== SLIDER CONTAINER ===== */
  .slider {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: flex-start; /* Move text to top */
    justify-content: flex-start;
    padding: 60px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }

  .slide.active {
    opacity: 1;
  }

  /* ===== LEFT VERTICAL HEADING ===== */
  .vertical-heading {
    position: absolute;
    left: 20px;
    bottom: 10%; /* Move to bottom left corner for design balance */
    transform: translateY(-50%) rotate(-90deg);
    transform-origin: left top;
    color: #a39f9f;
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeSlideUp 1.8s ease forwards;
    animation-delay: 0.5s;
  }

  /* ===== TEXT CONTENT ===== */
  .text-content {
    max-width: 450px;
    color: #fff;
    z-index: 2;
    text-align: start;
    margin-top: 100px; /* Padding from top */
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideUp 1.5s ease forwards;
    animation-delay: 1s;
  }

  .text-content p {
    font-size: 0.8rem;
    line-height: 1.7;
    color: #cfcfcf;
    letter-spacing: 1px;
  }

  /* ===== TEXT ANIMATION ===== */
  @keyframes fadeSlideUp {
    0% {
      opacity: 0;
      transform: translateY(20px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .slider { height: 60vh; }
    .slide {
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
    }
    .vertical-heading {display: none;}
    .text-content {
      max-width: 90%;
      margin: 80px auto 0;
      text-align: center;
    }
  }
</style>
</head>
<body>

<div class="slider">

  <!-- Slide 1 -->
  <div class="slide active" style="background-image: url('img/livingroomlights/pendentanimiation.png');">
    <div class="vertical-heading">Elegance in Suspension</div>
    <div class="text-content">
      <p>Suspended lights that blend design and illumination — creating inspiring spaces with effortless style.</p>
    </div>
  </div>

</div>

</body>
</html>
