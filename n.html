<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lighting Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #fff;
      font-family: Arial, sans-serif;
    }

    /* Left side heading */
    .section-title {
      font-size: 36px;
      font-weight: bold;
      line-height: 1.1;
      margin-bottom: 30px;
      
    }

    /* Each block */
    .lighting-block {
      text-align: center; 
    }

    .lighting-block img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 8px; /* Image & text madhya gap takkuva */
      transition: transform 0.4s ease;
    }

    .lighting-block:hover img {
      transform: scale(1.03);
    }

    /* Small top label (NEWS AUTUMN / TIPS & IDEAS) */
    .lighting-block h6 {
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: bold;
      color: #444;
      letter-spacing: 1px;
      margin-top: 60px;
    }

    /* Title (Optic Track / Outdoor lighting / Hall lighting) */
    .lighting-block h4 {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    /* Subtitle / description */
    .lighting-block p {
      font-size: 14px;
      color: #555;
      margin: 0;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row">

    <!-- Left side title -->
    <div class="col-lg-2">
      <h2 class="section-title">Choose the<br>right lighting<br>for your home</h2>
    </div>

    <!-- Right side blocks -->
    <div class="col-lg-10">
      <div class="row g-4">

        <!-- Block 1 -->
        <div class="col-md-4">
          <div class="lighting-block">
            <img src="img/abouimg/aboutimg1 (5).webp" alt="Optic Track">
            <h6>NEWS AUTUMN 2024</h6>
            <h4>Optic Track <br>1-phase</h4>
            <p>Minimalistic, dimmable track lights</p>
          </div>
        </div>

        <!-- Block 2 -->
        <div class="col-md-4">
          <div class="lighting-block">
            <img src="img/abouimg/aboutimg1 (5).webp" alt="Outdoor Lighting">
            <h6>TIPS & IDEAS</h6>
            <h4>Outdoor <br>lighting</h4>
            <p>Illuminate your garden and facade</p>
          </div>
        </div>

        <!-- Block 3 -->
        <div class="col-md-4">
          <div class="lighting-block">
            <img src="img/abouimg/aboutimg1 (5).webp" alt="Hall Lighting">
            <h6>TIPS & IDEAS</h6>
            <h4>Hall <br>lighting</h4>
            <p>A welcoming light</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

</body>
</html>
