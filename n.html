<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Reveal Animation</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    overflow: hidden;
  }

  .product-container {
    position: relative;
    width: 400px;  /* adjust as needed */
    height: 400px;
    perspective: 1000px; /* for 3D effect */
  }

  .product {
    width: 100%;
    height: 100%;
    background: url('img/lighting/outdoorlighting.png') no-repeat center/contain;
    transform: translateZ(-200px) scale(0.5) rotateY(0deg);
    opacity: 0;
    animation: reveal 2s ease-out forwards;
  }

  @keyframes reveal {
    0% {
      transform: translateZ(-200px) scale(0.5) rotateY(0deg);
      opacity: 0;
    }
    50% {
      transform: translateZ(50px) scale(1.1) rotateY(10deg);
      opacity: 1;
    }
    100% {
      transform: translateZ(0) scale(1) rotateY(0deg);
      opacity: 1;
    }
  }
</style>
</head>
<body>

<div class="product-container">
  <div class="product"></div>
</div>

</body>
</html>
