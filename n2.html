<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lighting Products</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  display: flex;
  background: #f8f8f8;
  color: #111;
  min-height: 100vh;
  flex-direction: row;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: #fff;
  border-right: 1px solid #ddd;
  padding: 25px;
  transition: all 0.4s ease;
}

.sidebar h2 {
  font-size: 20px;
  color: #111;
  margin-bottom: 25px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
}

.category {
  list-style: none;
}

.category li {
  margin-bottom: 8px;
}

.category button {
  width: 100%;
  background: none;
  border: none;
  text-align: left;
  font-size: 15px;
  color: #333;
  padding: 10px 8px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.3s ease;
  border-radius: 6px;
}

.category button::after {
  content: "→";
  font-size: 16px;
  color: #999;
  transition: all 0.3s ease;
}

.category button:hover,
.category button.active {
  background: #eaeaea;
  color: #000;
}

.category button:hover::after,
.category button.active::after {
  color: #000;
  transform: translateX(3px);
}

/* SUBMENU */
.submenu {
  list-style: none;
  margin-left: 15px;
  display: none;
}

.submenu li {
  padding: 5px 0;
}

.submenu li a {
  text-decoration: none;
  color: #555;
  font-size: 14px;
  transition: color 0.3s;
}

.submenu li a:hover {
  color: #000;
}

/* PRODUCT SECTION */
.product-section {
  flex: 1;
  padding: 40px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 35px;
  width: 100%;
  max-width: 1300px;
}

/* PRODUCT CARD */
.product-card {
  position: relative;
  background: #e6e6e6;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 360px;
  cursor: pointer;
  transition: transform 0.4s ease;
}

.product-card:hover {
  transform: translateY(-8px);
}

/* Image */
.product-card img {
  width: 210px;
  transition: transform 0.9s ease;
  z-index: 2;
  position: relative;
}

.product-card:hover img {
  transform: translate(-20px, -45px) scale(1.15);
}

/* Product name */
.product-card h3 {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  color: #111;
  font-size: 1.1rem;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.6s ease 0.4s, transform 0.6s ease 0.4s;
  z-index: 3;
}

.product-card:hover h3 {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Diagonal hover tone */
.product-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: #e6e6e6;
  z-index: 1;
  transition: all 1s ease;
}

.product-card:hover::before {
  background: linear-gradient(140deg, #ffffff 55%, #e6e6e6 45%);
}

/* ------------------- RESPONSIVE ------------------- */

/* Tablet view */
@media (max-width: 1024px) {
  .product-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
  }
  .product-card {
    height: 300px;
  }
  .product-card img {
    width: 180px;
  }
}

/* Mobile view */
@media (max-width: 768px) {
  body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #ddd;
    padding: 15px 20px;
  }

  .sidebar h2 {
    font-size: 18px;
    text-align: left;
    margin: 0;
  }

  .category {
    display: none;
    margin-top: 15px;
  }

  .category.show {
    display: block;
  }

  .product-section {
    padding: 20px;
  }

  .product-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .product-card {
    height: 280px;
  }

  .product-card img {
    width: 160px;
  }

  .product-card:hover img {
    transform: translate(-15px, -35px) scale(1.1);
  }

  .product-card h3 {
    font-size: 1rem;
    bottom: 20px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2 onclick="toggleSidebar()">Lighting ☰</h2>
  <ul class="category">
    <li><button onclick="filterProducts('all')" class="active">All</button></li>
    <li>
      <button onclick="toggleMenu(this); filterProducts('cob')">COB Lights</button>
      <ul class="submenu">
        <li><a href="#">COB Downlight</a></li>
        <li><a href="#">COB Surface</a></li>
        <li><a href="#">COB Zoom</a></li>
      </ul>
    </li>
    <li>
      <button onclick="toggleMenu(this); filterProducts('surface')">Surface Lights</button>
      <ul class="submenu">
        <li><a href="#">Surface Round</a></li>
        <li><a href="#">Surface Square</a></li>
      </ul>
    </li>
    <li>
      <button onclick="toggleMenu(this); filterProducts('track')">Track Lights</button>
      <ul class="submenu">
        <li><a href="#">Track Type 1</a></li>
        <li><a href="#">Track Type 2</a></li>
      </ul>
    </li>
  </ul>
</aside>

<!-- PRODUCT GRID -->
<section class="product-section">
  <div class="product-grid" id="productGrid">
    <div class="product-card" data-category="cob">
      <img src="img/productsimgs/1.png" alt="COB Downlight" />
      <h3>COB Downlight</h3>
    </div>
    <div class="product-card" data-category="cob">
      <img src="img/productsimgs/2.png" alt="COB Surface" />
      <h3>COB Surface</h3>
    </div>
    <div class="product-card" data-category="surface">
      <img src="img/productsimgs/3.png" alt="Surface Round" />
      <h3>Surface Round</h3>
    </div>
    <div class="product-card" data-category="surface">
      <img src="img/productsimgs/4.png" alt="Surface Square" />
      <h3>Surface Square</h3>
    </div>
    <div class="product-card" data-category="track">
      <img src="img/productsimgs/5.png" alt="Track Type 1" />
      <h3>Track Type 1</h3>
    </div>
    <div class="product-card" data-category="track">
      <img src="img/productsimgs/6.png" alt="Track Type 2" />
      <h3>Track Type 2</h3>
    </div>
  </div>
</section>

<script>
function toggleMenu(btn) {
  const submenu = btn.nextElementSibling;
  const allButtons = document.querySelectorAll(".category button");
  const allMenus = document.querySelectorAll(".submenu");

  allMenus.forEach((menu) => {
    if (menu !== submenu) menu.style.display = "none";
  });

  allButtons.forEach((b) => b.classList.remove("active"));

  if (submenu.style.display === "block") {
    submenu.style.display = "none";
  } else {
    submenu.style.display = "block";
    btn.classList.add("active");
  }
}

function filterProducts(category) {
  const cards = document.querySelectorAll(".product-card");
  const buttons = document.querySelectorAll(".category button");
  buttons.forEach((btn) => btn.classList.remove("active"));

  buttons.forEach((btn) => {
    if (
      btn.textContent.trim().toLowerCase().includes(category.toLowerCase()) ||
      (category === "all" && btn.textContent.trim().toLowerCase() === "all")
    ) {
      btn.classList.add("active");
    }
  });

  cards.forEach((card) => {
    if (category === "all" || card.dataset.category === category) {
      card.style.display = "flex";
    } else {
      card.style.display = "none";
    }
  });
}

function toggleSidebar() {
  const categoryList = document.querySelector(".category");
  categoryList.classList.toggle("show");
}
</script>

</body>
</html>
