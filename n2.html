<section id="innovation-features" class="feature-section-wrapper">
  <div id="features-container">
    <!-- Features will load here dynamically -->
  </div>

  <div class="view-more-wrap">
    <button id="viewMoreBtn">View More</button>
  </div>
</section>

<style>
.feature-section-wrapper {
  background: #111;
  padding: 80px 0;
}
#features-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 80px;
}
.view-more-wrap {
  text-align: center;
  margin-top: 60px;
}
#viewMoreBtn {
  background: transparent;
  border: 1px solid #fff;
  color: #fff;
  padding: 12px 28px;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
}
#viewMoreBtn:hover {
  background: #fff;
  color: #000;
}
</style>

<script>
const features = [
  {
    title: "Smart Pole",
    image: "img/11.png",
    points: [
      "EV Charging integration",
      "AI-based camera analytics",
      "5G-ready connectivity",
      "Solar power optimization",
      "IoT monitoring and alerts",
      "Modular component design"
    ]
  },
  {
    title: "Smart Bollard",
    image: "img/12.png",
    points: [
      "Impact-resistant design",
      "Integrated motion detection",
      "Adaptive lighting system",
      "Wi-Fi hotspot enabled",
      "AI-powered analytics"
    ]
  },
  // Add all 70 feature objects like this...
];

let visibleCount = 5;

function renderFeatures() {
  const container = document.getElementById("features-container");
  container.innerHTML = "";
  for (let i = 0; i < visibleCount && i < features.length; i++) {
    const f = features[i];
    container.innerHTML += `
      <div class="layout-card">
        <div class="left-panel"><img src="${f.image}" alt="${f.title}"></div>
        <div class="right-panel">
          <h1>${f.title}</h1>
          <ul class="points">${f.points.map(p => `<li>${p}</li>`).join('')}</ul>
        </div>
      </div>
    `;
  }

  if (visibleCount >= features.length) {
    document.getElementById("viewMoreBtn").style.display = "none";
  }
}

document.getElementById("viewMoreBtn").addEventListener("click", () => {
  visibleCount += 10;
  renderFeatures();
});

// Initial render
renderFeatures();
</script>
