<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Energy Scene Animation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    svg * {
      stroke: white;
      fill: none;
      stroke-width: 1.5;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: draw 2s ease forwards;
    }

    #solar_panel *        { animation-delay: 0.2s; }
    #wind_turbine *       { animation-delay: 1.2s; }
    #hydro_plant *        { animation-delay: 2.2s; }
    #smart_city *         { animation-delay: 3.2s; }
    #lighting *           { animation-delay: 4.2s; }
    #battery_station *    { animation-delay: 5.2s; }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>

  <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" width="90%" height="auto">

    <!-- Solar Panel -->
    <g id="solar_panel">
      <circle cx="100" cy="100" r="30"/>
      <line x1="100" y1="50" x2="100" y2="30"/>
      <line x1="100" y1="150" x2="100" y2="170"/>
      <line x1="70" y1="70" x2="50" y2="50"/>
      <line x1="130" y1="70" x2="150" y2="50"/>
      <line x1="70" y1="130" x2="50" y2="150"/>
      <line x1="130" y1="130" x2="150" y2="150"/>
      <rect x="180" y="250" width="20" height="80"/>
      <polygon points="50,150 350,150 310,230 10,230"/>
      <line x1="40" y1="165" x2="330" y2="165"/>
      <line x1="30" y1="180" x2="320" y2="180"/>
      <line x1="20" y1="195" x2="310" y2="195"/>
      <line x1="10" y1="210" x2="300" y2="210"/>
      <!-- Grid vertical -->
      <line x1="80" y1="150" x2="50" y2="230"/>
      <line x1="110" y1="150" x2="80" y2="230"/>
      <line x1="140" y1="150" x2="110" y2="230"/>
      <line x1="170" y1="150" x2="140" y2="230"/>
      <line x1="200" y1="150" x2="170" y2="230"/>
      <line x1="230" y1="150" x2="200" y2="230"/>
      <line x1="260" y1="150" x2="230" y2="230"/>
      <line x1="290" y1="150" x2="260" y2="230"/>
      <line x1="320" y1="150" x2="290" y2="230"/>
    </g>

    <!-- Wind Turbine -->
    <g id="wind_turbine">
      <line x1="150" y1="300" x2="150" y2="500"/>
      <line x1="150" y1="300" x2="150" y2="250"/>
      <line x1="150" y1="300" x2="193.3" y2="325"/>
      <line x1="150" y1="300" x2="106.7" y2="325"/>
      <circle cx="150" cy="300" r="5"/>
    </g>

    <!-- Hydroelectric Plant -->
    <g id="hydro_plant">
      <rect x="50" y="460" width="120" height="80"/>
      <line x1="70" y1="460" x2="70" y2="520"/>
      <line x1="100" y1="460" x2="100" y2="520"/>
      <line x1="130" y1="460" x2="130" y2="520"/>
      <path d="M50 540 q12 10 25 0"/>
      <path d="M75 540 q12 10 25 0"/>
      <path d="M100 540 q12 10 25 0"/>
      <path d="M125 540 q12 10 25 0"/>
      <path d="M150 540 q12 10 25 0"/>
      <path d="M70 520 q10 10 20 0"/>
      <path d="M100 520 q10 10 20 0"/>
      <path d="M130 520 q10 10 20 0"/>
    </g>

    <!-- Smart City -->
    <g id="smart_city">
      <rect x="800" y="80" width="40" height="120"/>
      <rect x="860" y="70" width="40" height="130"/>
      <rect x="920" y="60" width="40" height="140"/>
      <circle cx="820" cy="60" r="3"/>
      <path d="M820 60 q10 -10 20 0"/>
      <path d="M820 60 q10 10 20 0"/>
    </g>

    <!-- Lighting Products -->
    <g id="lighting">
      <line x1="850" y1="260" x2="850" y2="400"/>
      <rect x="840" y="260" width="20" height="10"/>
      <line x1="850" y1="270" x2="850" y2="280"/>
      <path d="M835 280 q15 20 30 0"/>
    </g>

    <!-- Battery / EV Station -->
    <g id="battery_station">
      <rect x="820" y="470" width="60" height="50"/>
      <line x1="830" y1="460" x2="830" y2="470"/>
      <line x1="860" y1="460" x2="860" y2="470"/>
      <line x1="857" y1="465" x2="863" y2="465"/>
      <line x1="827" y1="465" x2="833" y2="465"/>
      <line x1="830" y1="462" x2="830" y2="468"/>
    </g>

  </svg>

</body>
</html>
