<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 Step Workflow Animation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      
    }
    .flow-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 80px;
      position: relative;
      width: 90%;
      margin-left: auto;
      margin-right: auto;
    }
    .step {
      flex: 1;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
      position: relative;
    }
    .step.active {
      opacity: 1;
      transform: translateY(0);
    }
    .icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto;
    }
    .box {
      margin-top: 10px;
      padding: 8px 15px;
      border-radius: 10px;
      background: #ddd;
      font-size: 13px;
      font-weight: bold;
      display: inline-block;
    }
    .timeline {
      position: absolute;
      bottom: -30px;
      left: 0;
      height: 6px;
      background: #e5e5e5;
      width: 100%;
      border-radius: 4px;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 6px;
      background: #ff6600;
      width: 0%;
      border-radius: 4px;
      transition: width 1s linear;
    }
  </style>
</head>
<body>

  <div class="container text-center">
    <div class="flow-container">
      <!-- Steps -->
      <div class="step" id="step1">
        <div class="icon">📍</div>
        <p class="fw-bold mt-2">Site Survey</p>
      </div>
      <div class="step" id="step2">
        <div class="icon">🛠️</div>
        <p class="fw-bold mt-2">Solution Architecture</p>
      </div>
      <div class="step" id="step3">
        <div class="icon">⚙️</div>
        <p class="fw-bold mt-2">Installation</p>
      </div>
      <div class="step" id="step4">
        <div class="icon">✅</div>
        <p class="fw-bold mt-2">Commissioning</p>
      </div>
      <div class="step" id="step5">
        <div class="icon">📊</div>
        <p class="fw-bold mt-2">Performance Monitoring</p>
      </div>

      <!-- Timeline -->
      <div class="timeline">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    const steps = document.querySelectorAll('.step');
    const progressBar = document.querySelector('.progress-bar');
    let currentStep = 0;

    function resetFlow() {
      steps.forEach(step => step.classList.remove('active'));
      progressBar.style.width = "0%";
      currentStep = 0;
    }

    function showNextStep() {
      if (currentStep < steps.length) {
        steps[currentStep].classList.add('active');
        progressBar.style.width = `${((currentStep + 1) / steps.length) * 100}%`;
        currentStep++;
      } else {
        setTimeout(() => {
          resetFlow();
        }, 1000);
      }
    }

    function startFlow() {
      resetFlow();
      let i = 0;
      const interval = setInterval(() => {
        showNextStep();
        i++;
        if (i > steps.length) {
          clearInterval(interval);
          setTimeout(startFlow, 1500); // restart infinite
        }
      }, 2000); // each step shows every 2 sec
    }

    startFlow();
  </script>

</body>
</html>
