<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanaka Style Premium Clone</title>

<!-- GSAP & ScrollTrigger -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

section {
  min-height: 100vh;
  padding: 100px 20px;
  transition: background 1s ease, color 1s ease;
}

body[data-theme="dark"] {
  background: #111;
  color: #fff;
}

body[data-theme="light"] {
  background: #f8f9fa;
  color: #111;
}

.split span {
  display: inline-block;
  opacity: 0;
  transform: translateY(50px);
}

.horizontal-scroll {
  display: flex;
  flex-wrap: nowrap;
  height: 100vh;
  overflow: hidden;
}

.panel {
  flex: 0 0 100vw;
  position: relative;
  overflow: hidden;
}

.panel img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.2);
}

.image-mask {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #111;
  transform-origin: left;
  transform: scaleX(1);
  z-index: 2;
}

section[data-bg] {
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

h1 {
  font-size: 3rem;
  font-weight: bold;
}

footer {
  padding: 50px;
  text-align: center;
}
</style>
</head>
<body data-theme="dark">

<!-- HEADER SECTION -->
<section id="header" data-bg="https://picsum.photos/1600/900?random=10">
  <div class="container text-center">
    <h1 class="split">Premium Studio Clone</h1>
    <p>Dummy subtitle with smooth split-text animation</p>
  </div>
</section>

<!-- HORIZONTAL SCROLL SECTION -->
<section class="horizontal-scroll">
  <div class="panel image-panel">
    <div class="image-mask"></div>
    <img src="https://picsum.photos/1600/900?random=1" alt="Dummy Image">
  </div>
  <div class="panel image-panel">
    <div class="image-mask"></div>
    <img src="https://picsum.photos/1600/900?random=2" alt="Dummy Image">
  </div>
  <div class="panel image-panel">
    <div class="image-mask"></div>
    <img src="https://picsum.photos/1600/900?random=3" alt="Dummy Image">
  </div>
</section>

<!-- IMAGE REVEAL SECTION -->
<section data-bg="https://picsum.photos/1600/900?random=5">
  <div class="container text-center">
    <h1 class="split">Image Reveal Section</h1>
    <p>Dummy content showcasing premium animation.</p>
  </div>
</section>

<!-- PARALLAX SECTION -->
<section data-bg="https://picsum.photos/1600/900?random=6">
  <div class="container text-center">
    <h1 class="split">Parallax Background Section</h1>
    <p>Another dummy section with background parallax.</p>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <p>Dummy Footer © 2025</p>
</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

// Split-text animation
document.querySelectorAll(".split").forEach(el => {
  const text = el.innerText;
  el.innerHTML = text.split("").map(char => `<span>${char}</span>`).join("");
  gsap.fromTo(el.querySelectorAll("span"), 
    {y:50, opacity:0}, 
    {
      y:0, opacity:1, 
      stagger:0.05, duration:1, ease:"power4.out",
      scrollTrigger: {
        trigger: el,
        start: "top 80%",
        toggleActions: "play none none reverse"
      }
    }
  );
});

// Horizontal scroll section
let scrollContainer = document.querySelector(".horizontal-scroll");
let panels = gsap.utils.toArray(".panel");

gsap.to(panels, {
  xPercent: -100 * (panels.length - 1),
  ease: "none",
  scrollTrigger: {
    trigger: ".horizontal-scroll",
    pin: true,
    scrub: 1,
    snap: 1 / (panels.length - 1),
    end: () => "+=" + scrollContainer.offsetWidth
  }
});

// Image reveal animation
document.querySelectorAll(".image-panel").forEach(panel=>{
  let img = panel.querySelector("img");
  let mask = panel.querySelector(".image-mask");

  gsap.set(img,{scale:1.2});
  gsap.set(mask,{scaleX:1});

  ScrollTrigger.create({
    trigger:panel,
    start:"top 80%",
    end:"top 20%",
    onEnter:()=>{
      gsap.timeline()
        .to(mask,{scaleX:0,duration:1.2,ease:"power3.inOut"})
        .to(img,{scale:1,duration:1.2,ease:"power3.inOut"},"-=1");
    },
    onLeaveBack:()=>{
      gsap.timeline()
        .to(mask,{scaleX:1,duration:1.2,ease:"power3.inOut"})
        .to(img,{scale:1.2,duration:1.2,ease:"power3.inOut"},"-=1");
    }
  });
});

// Background theme changes
gsap.utils.toArray("section").forEach((section, index) => {
  ScrollTrigger.create({
    trigger: section,
    start: "top 50%",
    end: "bottom 50%",
    onEnter: () => {
      document.body.setAttribute("data-theme", index % 2 === 0 ? "dark" : "light");
    },
    onEnterBack: () => {
      document.body.setAttribute("data-theme", index % 2 === 0 ? "dark" : "light");
    }
  });
});

// Section background parallax
document.querySelectorAll("section[data-bg]").forEach(section => {
  section.style.backgroundImage = `url(${section.getAttribute("data-bg")})`;
  gsap.from(section, {
    backgroundPosition: "50% 0%",
    ease: "none",
    scrollTrigger: {
      trigger: section,
      scrub: true
    }
  });
});
</script>
</body>
</html>
