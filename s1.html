<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Energy - How It Works</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(#87ceeb, #e0f7fa); /* sky */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .wind-section {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px;
    }

    /* SVG Scene */
    .wind-scene {
      width: 55%;
    }

    /* Text Area */
    .wind-text {
      width: 40%;
      color: #222;
    }

    .wind-text h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .wind-text p {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    /* SVG Styling */
    svg {
      width: 100%;
      height: auto;
    }

    .turbine-blades {
      transform-origin: center;
      transform-box: fill-box;
    }

    .wind-arrow {
      stroke: #4fc3f7;
      stroke-width: 3;
      stroke-dasharray: 10 10;
      animation: dashmove 2s linear infinite;
    }

    @keyframes dashmove {
      to {
        stroke-dashoffset: -20;
      }
    }

    .house-light {
      fill: #ccc;
      transition: fill 1s ease;
    }

    .house-light.on {
      fill: #ffeb3b;
    }
  </style>
</head>
<body>
  <div class="wind-section">
    <!-- Left side: SVG Scene -->
    <div class="wind-scene">
      <svg viewBox="0 0 600 400">
        <!-- Ground -->
        <rect x="0" y="350" width="600" height="50" fill="#4caf50"/>

        <!-- Wind Arrows -->
        <line x1="20" y1="120" x2="200" y2="120" class="wind-arrow"/>
        <line x1="20" y1="160" x2="200" y2="160" class="wind-arrow"/>
        <line x1="20" y1="200" x2="200" y2="200" class="wind-arrow"/>

        <!-- Wind Turbine -->
        <g transform="translate(250,200)">
          <rect x="-5" y="0" width="10" height="150" fill="#888"/>
          <g class="turbine-blades">
            <circle r="10" fill="#444"/>
            <polygon points="0,-10 80,-20 0,-40" fill="#ddd"/>
            <polygon points="0,10 -20,80 -40,0" fill="#ddd"/>
            <polygon points="10,0 40,0 20,-80" fill="#ddd"/>
          </g>
        </g>

        <!-- House -->
        <g transform="translate(450,250)">
          <rect x="0" y="50" width="80" height="60" fill="#795548"/>
          <polygon points="0,50 40,10 80,50" fill="#00000"/>
          <rect x="25" y="70" width="30" height="20" class="house-light"/>
        </g>
      </svg>
    </div>

    <!-- Right side: Text -->
    <div class="wind-text">
      <h2>How Wind Energy Works</h2>
      <p>1. Wind flows across the blades, making them rotate.</p>
      <p>2. The rotor spins a shaft inside the nacelle (the box on top).</p>
      <p>3. The shaft connects to a generator, producing electricity.</p>
      <p>4. The power is transferred to homes and industries, lighting up communities sustainably.</p>
    </div>
  </div>

  <script>
    // Rotate turbine blades
    gsap.to(".turbine-blades", {
      rotate: 360,
      transformOrigin: "center",
      duration: 4,
      repeat: -1,
      ease: "linear"
    });

    // Animate house light turning on after delay
    setTimeout(() => {
      document.querySelector(".house-light").classList.add("on");
    }, 4000);
  </script>
</body>
</html>
