<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      font-family: Arial, sans-serif;
    }

    .card-custom {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 12px;
      height: 450px;
      text-align: center;
      background: #fff;
      transition: all 0.5s ease;
    }

    .card-img {
      width: 180px;              /* small circle */
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      margin: 40px auto 20px;
      display: block;
      transition: all 0.6s ease-in-out;
      z-index: 1;
      position: relative;
    }

    .card-body {
      padding: 15px;
      transition: all 0.6s ease;
      position: relative;
      z-index: 2;
      
    }

    /* Hover effect */
    .card-custom:hover .card-img {
      width: 100%;
      height: 100%;
      margin: 0;
      border-radius: 0;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0; /* send image behind text */
    }

    .card-custom:hover .card-body {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 100px;
      width: 90%;
      background: rgba(255, 255, 255, 0.9); 
      /* padding: 20px; */
      z-index: 2;
    }

    .capacity {
      font-weight: bold;
      color: #57b846; /* green */
      font-size: 1.5rem;
    }

    .title {
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row g-4 justify-content-center">
    
    <!-- Card 1 -->
    <div class="col-md-4">
      <div class="card-custom">
        <img src="img/sol.webp" alt="Utility-Scale Wind" class="card-img">
        <div class="card-body">
          <h5 class="title">Utility-Scale Wind</h5>
          <p class="capacity">7.9 GW</p>
          <!-- <p>Commissioned And Installed Capacity</p> -->
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="col-md-4">
      <div class="card-custom">
        <img src="img/sol.webp" alt="Utility-Scale Solar" class="card-img">
        <div class="card-body">
          <h5 class="title">Utility-Scale Solar</h5>
          <p class="capacity">10.5 GW</p>
          <!-- <p>Commissioned And Installed Capacity</p> -->
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="col-md-4">
      <div class="card-custom">
        <img src="img/sol.webp" alt="Round-The-Clock" class="card-img">
        <div class="card-body">
          <h5 class="title">Firm Power</h5>
          <p class="capacity">High-Quality Portfolio</p>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
