<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Arcot Industries Lighting Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: #f8f8f8;
    }

    .lighting-container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 25px 15px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
    }

    .category {
      list-style: none;
      padding-left: 0;
    }

    .category li {
      margin-bottom: 8px;
    }

    .category button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      font-size: 15px;
      color: #333;
      padding: 10px 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .category button::after {
      content: "→";
      color: #999;
      margin-left: auto;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .category button.active::after {
      color: #000;
      transform: translateX(3px);
    }

    .category button:hover {
      background: #eaeaea;
      color: #000;
    }

    .submenu {
      list-style: none;
      margin-left: 15px;
      display: none;
    }

    /* Product Section */
    .product-section {
      flex: 1;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* FILTER BOXES */
    .filters-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 15px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    .filter-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      min-width: 150px;
      flex-shrink: 0;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .filter-box h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #222;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    .filter-box button {
      display: block;
      width: 100%;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 5px;
      font-size: 13px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .filter-box button:hover {
      background: #f2f2f2;
    }

    .filter-box button.active {
      background: #00bcd4;
      color: #fff;
      border-color: #00bcd4;
    }

    /* PRODUCT GRID */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 35px;
      width: 100%;
      max-width: 1300px;
      margin: auto;
    }

    .product-card {
      position: relative;
      background: #e6e6e6;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .product-card img {
      width: 230px;
      transition: transform 0.4s ease;
      margin-top: 20px;
      position: relative;
      z-index: 2;
    }

    .product-card:hover img {
      transform: scale(1.1);
    }

    .product-card h3 {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #111;
      text-align: center;
      z-index: 3;
      position: relative;
    }

    .product-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #e6e6e6;
      z-index: 1;
      transition: all 0.8s ease;
    }

    .product-card:hover::before {
      background: linear-gradient(140deg, #ffffff 55%, #e6e6e6 45%);
    }

    @media (max-width: 768px) {
      .filters-row {
        flex-wrap: nowrap;
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <div class="lighting-container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Lighting</h2>
      <ul class="category">
        <li><button onclick="filterProducts('all', this)">All</button></li>
        <li><button onclick="toggleMenu(this); filterProducts('track', this)">Track Lights</button></li>
        <li><button onclick="toggleMenu(this); filterProducts('magnetic', this)">Magnetic Track Lights</button></li>
        <li><button onclick="toggleMenu(this); filterProducts('slimtrack', this)">Slim Track Lights</button></li>
        <li><button onclick="toggleMenu(this); filterProducts('cob', this)">COB Lights</button></li>
        <li><button onclick="toggleMenu(this); filterProducts('surface', this)">Surface Lights</button></li>
      </ul>
    </aside>

    <!-- Product Section -->
    <div class="product-section">

      <!-- FILTER BOXES -->
      <div class="filters-row">

        <div class="filter-box">
          <h4>Type</h4>
          <button onclick="filterAttribute('type','indoor')">Indoor</button>
          <button onclick="filterAttribute('type','outdoor')">Outdoor</button>
        </div>

        <div class="filter-box">
          <h4>Mounting</h4>
          <button onclick="filterAttribute('mount','ceiling')">Ceiling</button>
          <button onclick="filterAttribute('mount','recessed')">Recessed</button>
          <button onclick="filterAttribute('mount','surface')">Surface</button>
        </div>

        <div class="filter-box">
          <h4>IP Rating</h4>
          <button onclick="filterAttribute('ip','ip20')">IP20</button>
          <button onclick="filterAttribute('ip','ip65')">IP65</button>
        </div>

        <div class="filter-box">
          <h4>Wattage</h4>
          <button onclick="filterAttribute('watt','10w')">10W</button>
          <button onclick="filterAttribute('watt','20w')">20W</button>
          <button onclick="filterAttribute('watt','30w')">30W</button>
        </div>

        <div class="filter-box">
          <h4>Control / Protocol</h4>
          <button onclick="filterAttribute('control','dali')">DALI</button>
          <button onclick="filterAttribute('control','onoff')">On/Off</button>
          <button onclick="filterAttribute('control','bluetooth')">Bluetooth</button>
        </div>

        <div class="filter-box">
          <h4>Application</h4>
          <button onclick="filterAttribute('app','residential')">Residential</button>
          <button onclick="filterAttribute('app','commercial')">Commercial</button>
          <button onclick="filterAttribute('app','industrial')">Industrial</button>
        </div>

        <div class="filter-box">
          <h4>Body Color</h4>
          <button onclick="filterAttribute('color','white')">White</button>
          <button onclick="filterAttribute('color','black')">Black</button>
          <button onclick="filterAttribute('color','silver')">Silver</button>
        </div>
      </div>

      <!-- PRODUCT GRID -->
      <div class="product-grid">
        <div class="product-card" data-category="track" data-type="indoor" data-mount="ceiling" data-ip="ip20"
          data-watt="10w" data-control="dali" data-app="commercial" data-color="white">
          <img src="img/productsimgs/5.png" alt="Track Type 1">
          <h3>Track Type 1</h3>
        </div>

        <div class="product-card" data-category="magnetic" data-type="outdoor" data-mount="surface" data-ip="ip65"
          data-watt="20w" data-control="onoff" data-app="residential" data-color="black">
          <img src="img/productsimgs/magnetic1.png" alt="Magnetic Track 1">
          <h3>Magnetic Track 1</h3>
        </div>

        <div class="product-card" data-category="slimtrack" data-type="indoor" data-mount="recessed" data-ip="ip20"
          data-watt="10w" data-control="dali" data-app="commercial" data-color="silver">
          <img src="img/productsimgs/slimtrack1.png" alt="Slim Track 1">
          <h3>Slim Track 1</h3>
        </div>

        <div class="product-card" data-category="cob" data-type="indoor" data-mount="surface" data-ip="ip20"
          data-watt="20w" data-control="bluetooth" data-app="residential" data-color="white">
          <img src="img/productsimgs/1.png" alt="COB Downlight">
          <h3>COB Downlight</h3>
        </div>

        <div class="product-card" data-category="surface" data-type="outdoor" data-mount="ceiling" data-ip="ip65"
          data-watt="30w" data-control="onoff" data-app="industrial" data-color="black">
          <img src="img/productsimgs/3.png" alt="Surface Round">
          <h3>Surface Round</h3>
        </div>
      </div>

    </div>
  </div>

  <script>
    let activeFilters = {};

    function toggleMenu(btn) {
      const submenu = btn.nextElementSibling;
      const allMenus = document.querySelectorAll(".submenu");
      allMenus.forEach(m => { if (m !== submenu) m.style.display = "none"; });
      if (submenu) submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }

    function filterProducts(category, btn) {
      const cards = document.querySelectorAll(".product-card");
      const buttons = document.querySelectorAll(".category > li > button");
      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      cards.forEach(c => {
        let show = category === "all" || c.dataset.category === category;
        for (let key in activeFilters) {
          if (c.dataset[key] !== activeFilters[key]) show = false;
        }
        c.style.display = show ? "flex" : "none";
      });
    }

    function filterAttribute(attr, value) {
      // toggle filter
      if (activeFilters[attr] === value) delete activeFilters[attr];
      else activeFilters[attr] = value;

      const cards = document.querySelectorAll(".product-card");
      const activeCategoryBtn = document.querySelector(".category button.active");
      const activeCategory = activeCategoryBtn ? activeCategoryBtn.textContent.toLowerCase().replace(/ /g, '') : "all";

      cards.forEach(card => {
        let show = activeCategory === "all" || card.dataset.category.toLowerCase() === activeCategory;
        for (let key in activeFilters) {
          if (card.dataset[key] !== activeFilters[key]) show = false;
        }
        card.style.display = show ? "flex" : "none";
      });

      // highlight active buttons
      document.querySelectorAll('.filter-box button').forEach(b => b.classList.remove('active'));
      Object.entries(activeFilters).forEach(([k, v]) => {
        document.querySelectorAll(`.filter-box button[onclick="filterAttribute('${k}','${v}')"]`).forEach(b => b.classList.add('active'));
      });
    }
  </script>
</body>
</html>
