<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight Effect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Professional Sans-serif */
    }

    /* Main Div */
    .applechild-container {
      position: relative;
      width: 100%;
      height: 100vh; /* Full screen height */
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Image full fit (no crop) */
    .applechild-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;   /* FULL visibility - no crop */
      object-position: center;
      z-index: 1;
    }

    /* Dark Overlay */
    .applechild-overlay {
      position: absolute;
      inset: 0;
    }

    /* Light Rays */
    .applechild-light-rays {
      position: absolute;
      top: -30%;
      right: -20%;
      width: 80vw;
      height: 80vw;
      background: radial-gradient(ellipse at top right, rgba(255,255,255,0.6), transparent 70%);
      filter: blur(80px);
      opacity: 0;
      animation: applechild-fadeIn 2s ease-in-out forwards;
      z-index: 3;
    }

    /* Animated Text */
    .applechild-text {
      position: absolute;
      top: 50%;                 /* vertical middle */
      left: 10%;                /* align left */
      transform: translateY(-50%);
      color: white;
      font-size: clamp(1.8rem, 5vw, 3.5rem); /* Responsive size */
      font-weight: 300;         /* thin text */
      letter-spacing: 3px;      /* spacing */
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0,0,0,0.7);
      opacity: 0;
      animation: applechild-textIn 2s ease-out forwards 1s;
      z-index: 4;
    }

    /* Animations */
    @keyframes applechild-fadeIn {
      from { opacity: 0; transform: scale(0.8) rotate(-15deg); }
      to { opacity: 0.6; transform: scale(1) rotate(0deg); }
    }

    @keyframes applechild-textIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(-50%); }
    }

    /* Mobile tweaks */
    @media (max-width: 768px) {
      .applechild-text {
        left: 5%;  /* closer to edge */
        font-size: clamp(1.4rem, 6vw, 2.2rem);
        letter-spacing: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="applechild-container">
    <!-- Image -->
    <img src="img/childapple.png" alt="Background">

    <!-- Overlay -->
    <div class="applechild-overlay"></div>

    <!-- Light Rays -->
    <div class="applechild-light-rays"></div>

    <!-- Animated Text -->
    <div class="applechild-text">Magic of Light</div>
  </div>
</body>
</html>
