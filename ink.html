<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Section</title>
<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background-color: #fff;
  color: #111;
}

.about-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 100px 8%;
  gap: 60px;
  position: relative;
}

.about-image {
  flex: 1;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.about-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 1s ease;
}

.about-image:hover img {
  transform: scale(1.05);
}

.about-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.about-content h2 {
  font-size: 36px;
  font-weight: 600;
  margin-bottom: 20px;
  position: relative;
}

.about-content h2::after {
  content: "";
  position: absolute;
  bottom: -8px;
  left: 0;
  width: 60px;
  height: 3px;
  background: #111;
}

.about-content p {
  font-size: 16px;
  line-height: 1.8;
  color: #555;
  margin-bottom: 30px;
}

.about-content a {
  display: inline-block;
  text-decoration: none;
  background-color: #111;
  color: #fff;
  padding: 12px 26px;
  border-radius: 30px;
  font-size: 15px;
  transition: all 0.3s ease;
}

.about-content a:hover {
  background-color: #333;
  transform: translateY(-2px);
}

/* Responsive layout */
@media (max-width: 992px) {
  .about-section {
    flex-direction: column-reverse;
    padding: 70px 6%;
    text-align: center;
  }

  .about-content h2::after {
    left: 50%;
    transform: translateX(-50%);
  }
}
</style>
</head>
<body>

<section class="about-section">
  <div class="about-content">
    <h2>About Our Company</h2>
    <p>We are a team of innovators and creators dedicated to designing meaningful digital experiences. Our focus is on delivering premium, modern, and scalable solutions that empower businesses to grow with confidence and creativity.</p>
    <a href="#learnmore">Learn More</a>
  </div>
  <div class="about-image">
    <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=900&q=80" alt="About Us">
  </div>
</section>

</body>
</html>
