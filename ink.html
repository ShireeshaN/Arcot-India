<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Section - Premium Minimal</title>
<style>
/* body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background-color: #fff;
  color: #111;
} */

/* ---- Layout ---- */
.about-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 100px 8%;
  gap: 60px;
}

.about-image {
  flex: 1;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.about-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 1s ease;
}

.about-image:hover img {
  transform: scale(1.05);
}

.about-content {
  flex: 1;
}

.about-content h2 {
  font-size: 36px;
  font-weight: 600;
  margin-bottom: 20px;
  position: relative;
}

.about-content h2::after {
  content: "";
  position: absolute;
  bottom: -8px;
  left: 0;
  width: 60px;
  height: 2px;
  background: #000;
}

.about-content p {
  font-size: 16px;
  line-height: 1.8;
  color: #555;
  margin-bottom: 40px;
}

/* ---- Premium Minimal Button ---- */
.about-content a {
  display: inline-block;
  text-decoration: none;
  background: transparent;
  color: #111;
  border: 1px solid #111;
  padding: 8px 20px;
  font-size: 13px;
  letter-spacing: 0.5px;
  font-weight: 500;
  transition: all 0.3s ease;
}

.about-content a:hover {
  background-color: #111;
  color: #fff;
  transform: translateY(-2px);
}

/* ---- Hover Arrow ---- */
.about-content a::after {
  content: "→";
  font-size: 13px;
  margin-left: 8px;
  transition: transform 0.3s ease;
}

.about-content a:hover::after {
  transform: translateX(4px);
}

/* ---- Responsive ---- */
@media (max-width: 992px) {
  .about-section {
    flex-direction: column-reverse;
    text-align: center;
    padding: 70px 6%;
  }

  .about-content h2::after {
    left: 50%;
    transform: translateX(-50%);
  }
}
</style>
</head>
<body>

<section class="about-section">
  <div class="about-content">
    <h2>About Our Company</h2>
    <p>We’re a passionate team driven by design and innovation, creating digital experiences that merge elegance with function. Every project reflects our dedication to precision, performance, and premium quality.</p>
    <a href="contact.html">Learn More</a>
  </div>

  <div class="about-image">
    <img src="img/aboutsimg.png" alt="About Us">
  </div>
</section>

</body>
</html>
