<style>
body {
  font-family: "Poppins", sans-serif;
  background-color: #fff;
  margin: 0;
  padding: 40px;
  color: #111;
}

/* --- FILTER SECTION --- */
.filters {
  display: flex;
  justify-content: space-between;
  border: 1px solid #ddd;
  padding: 30px 20px;
  margin-bottom: 50px;
}

.filter-box {
  flex: 1;
  padding: 0 30px;
  border-right: 1px solid #eee;
}
.filter-box:last-child {
  border-right: none;
}

.filter-box h4 {
  font-size: 14px;
  font-weight: 600;
  color: #777;
  margin-bottom: 15px;
  text-transform: uppercase;
}

.filter-box ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.filter-box ul li {
  margin-bottom: 8px;
}

.filter-box ul li a {
  position: relative;
  text-decoration: none;
  color: #000;
  font-weight: 600;
  transition: color 0.3s ease;
}

.filter-box ul li a::after {
  content: "";
  position: absolute;
  bottom: -3px;
  left: 0;
  width: 0%;
  height: 2px;
  background: #000;
  transition: width 0.3s ease;
}
.filter-box ul li a:hover::after {
  width: 100%;
}

/* --- PRODUCT GRID --- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
}

.product-card {
  background: #d9d9d9;
  border-radius: 4px;
  overflow: hidden;
  text-align: center;
  position: relative;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.product-card:hover {
  transform: translateY(-4px);
}

.product-card img {
  width: 100%;
  height: 340px;
  object-fit: contain;
  background: #d9d9d9;
  transition: opacity 0.3s ease;
}

.product-info {
  padding: 25px 10px;
}

.product-info h3 {
  font-size: 15px;
  font-weight: 700;
  margin: 0;
}

.product-info .type {
  font-size: 14px;
  color: #333;
  margin-top: 4px;
}

.product-info .designer {
  font-size: 13px;
  color: #888;
  margin-top: 8px;
  transition: opacity 0.3s ease;
}

.color-options {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.product-card:hover .designer {
  opacity: 0;
}

.product-card:hover .color-options {
  opacity: 1;
  pointer-events: all;
}

/* --- COLOR DOTS --- */
.color-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  display: inline-block;
  border: 1px solid #777;
  transition: transform 0.2s ease;
}
.color-dot:hover {
  transform: scale(1.2);
}
.color-dot.black {
  background: #000;
}
.color-dot.white {
  background: #fff;
  border: 1px solid #999;
}
.color-dot.bronze {
  background: #a97142;
}
.color-dot.silver {
  background: #c0c0c0;
}
</style>

/* --- SHOW PRODUCTS --- */
function showProducts(category) {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";
  const items = allProducts[category] || [];
  renderProducts(items);
}

/* --- SHOW ALL PRODUCTS --- */
function showAllProducts() {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";
  const items = Object.values(allProducts).flat();
  renderProducts(items);
}

/* --- RENDER FUNCTION --- */
function renderProducts(items) {
  const grid = document.getElementById("productGrid");
  items.forEach((p) => {
    const card = document.createElement("div");
    card.className = "product-card";
    const defaultColor = "black";
    card.innerHTML = `
      <img src="${p.images[defaultColor]}" alt="${p.name}" />
      <div class="product-info">
        <h3>${p.name}</h3>
        <div class="type">${p.type}</div>
        <div class="designer">${p.designer}</div>
        <div class="color-options">
          ${Object.keys(p.images)
            .map(
              (color) =>
                `<span class="color-dot ${color}" onmouseover="this.closest('.product-card').querySelector('img').src='${p.images[color]}'"></span>`
            )
            .join("")}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}
