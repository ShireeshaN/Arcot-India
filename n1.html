<!-- ENERGY GENERATION START -->
<div class="energygenss-wrapper">
  <div class="energygenss">

    <!-- Wind -->
    <div class="energygenss-item">
      <video src="media/wind.mp4" muted playsinline></video>
      <span class="item-name">Wind</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/energy/wind2.webp');">
      <span class="item-name">Wind</span>
    </div>

    <!-- Solar -->
    <div class="energygenss-item">
      <video src="media/solar.mp4" muted playsinline></video>
      <span class="item-name">Solar</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/energy/solar2.png');">
      <span class="item-name">Solar</span>
    </div>

    <!-- Biomass -->
    <div class="energygenss-item">
      <video src="media/biomass.mp4" muted playsinline></video>
      <span class="item-name">Biomass</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/energy/biomass2.png');">
      <span class="item-name">Biomass</span>
    </div>

    <!-- Hydel -->
    <div class="energygenss-item">
      <video src="media/hydelplant.mp4" muted playsinline></video>
      <span class="item-name">Hydel</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/energy/hydel2.png');">
      <span class="item-name">Hydel</span>
    </div>

  </div>
</div>

<script>
const items = document.querySelectorAll('.energygenss-item');
let currentIndex = 0;
let autoSlide;

function activateItem(index){
  items.forEach((item,i)=>{
    const video = item.querySelector('video');
    const name = item.querySelector('.item-name');

    item.classList.remove('active');

    if(i===index){
      item.classList.add('active');
      // hide name for active
      if(name) name.style.opacity = "0";

      if(video){
        video.currentTime = 0;
        video.play();
        video.onended = ()=>{ goNext(); };
      }
    } else {
      // show name for inactive
      if(name) name.style.opacity = "0.9";
      if(video) video.pause();
    }
  });
}

function goNext(){
  clearTimeout(autoSlide);
  currentIndex = (currentIndex + 1) % items.length;
  activateItem(currentIndex);

  const activeItem = items[currentIndex];
  const video = activeItem.querySelector("video");

  if(video){
    video.onended = ()=>{ goNext(); };
    video.play();
  } else {
    autoSlide = setTimeout(goNext, 4000);
  }
}

// Manual click override
items.forEach((item,index)=>{
  item.addEventListener('click', ()=>{
    clearTimeout(autoSlide);
    currentIndex = index;
    activateItem(currentIndex);
    const activeItem = items[currentIndex];
    if(!activeItem.querySelector('video')){
      autoSlide = setTimeout(goNext, 4000);
    }
  });
});

// Start
activateItem(currentIndex);
goNext();
</script>

<style>
.energygenss-wrapper {
  width: 100%;
  overflow: hidden;
  background: #dddcdc;
}

.energygenss {
  display: flex;
  width: 100%;
  height: 500px;
  overflow: hidden;
  margin: 0;
  padding: 0;
}

.energygenss-item {
  flex: 0.4; /* inactive items uniform width */
 top: 50%;
 left:50%;
  background-size: cover;
  background-position: center;
  transition: flex 0.6s ease, filter 0.6s ease, transform 0.6s ease;
  cursor: pointer;
  position: ab;
  display: flex;
  justify-content: center;
  align-items: center;
  filter: grayscale(80%) brightness(0.6);
  overflow: hidden;
}

.energygenss-item video {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.9;
}

/* Overlay shading */
.energygenss-item::after {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.4);
  transition: background 0.4s ease;
}

/* Name visible only in inactive items */
.energygenss-item span.item-name {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-90deg);
  font-size: 18px;
  font-weight: 600;
  opacity: 0.9;
  color: #fff;
  z-index: 2;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

/* Active item bigger */
.energygenss-item.active {
  flex: 4; /* active expands */
  filter: grayscale(0%) brightness(1);
  transform: scale(1.05);
}

.energygenss-item.active::after {
  background: rgba(0,0,0,0.05);
}

/* Hide name on active item */
.energygenss-item.active span.item-name {
  opacity: 0;
}

/* Mobile layout */
@media (max-width: 768px) {
  .energygenss {
    flex-direction: column;
    height: auto;
  }
  .energygenss-item {
    flex: none;
    width: 100%;
    height: 70px;
  }
  .energygenss-item.active {
    height: 280px;
    transform: none;
  }
  .energygenss-item span.item-name {
    font-size: 16px;
    transform: translate(-50%, -50%) rotate(0deg); /* mobile lo horizontal text */
  }
}

</style>
<!-- ENERGY GENERATION END -->
