<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart City Slider</title>
<style>
  /* Custom Theme Colors */
  :root{
    --sc-bg:#f5f5f6;
    --sc-text:#1a1a1a;
    --sc-muted:#555;
    --sc-accent:#111; 
  }

  body{
    margin:0;
    font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--sc-bg);
    color:var(--sc-text);
  }

  .smartcity-slider{
    max-width:1200px;
    margin:0 auto;
    padding:60px 20px;
    position:relative;
  }

  .sc-slide{
    display:grid;
    grid-template-columns: 55% 45%; 
    align-items:center;
    gap:30px;
    position:relative;
  }

  /* --- IMAGE --- */
  .sc-media{
    height:340px;
    overflow:hidden;
    position:relative;
  }
  .sc-media img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transform:translateX(80px) scale(1.05);
    transition:all 1s ease;
  }
  .sc-media img.sc-active{
    opacity:1;
    transform:translateX(0) scale(1);
  }

  /* --- TEXT --- */
  .sc-copy{
    position:relative;
    padding-bottom:50px;
  }
  .sc-title{
    font-size:30px;font-weight:800;margin:0 0 14px;
    opacity:0;transform:translateX(-80px);
    transition:all 1s ease;
  }
  .sc-desc{
    font-size:17px;line-height:1.6;color:var(--sc-muted);margin:0;
    opacity:0;transform:translateX(-80px);
    transition:all 1s ease;
  }
  .sc-active-text .sc-title,
  .sc-active-text .sc-desc{
    opacity:1;transform:translateX(0);
  }

  /* --- INDICATOR --- */
  .sc-indicator{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:25px;
  }
  .sc-indicator span{
    font-size:14px;
    padding:6px 12px;
    border-radius:20px;
    background:#fff;
    border:1px solid #ccc;
    opacity:0.7;
    transition:all 0.4s;
  }
  .sc-indicator span.sc-active{
    background:var(--sc-accent);
    color:#fff;
    opacity:1;
  }

  /* --- PROGRESS BAR --- */
  .sc-progress-bar{
    height:3px;
    width:100%;
    background:#ddd;
    margin-top:14px;
    position:relative;
    overflow:hidden;
    border-radius:3px;
  }
  .sc-progress-fill{
    height:100%;
    width:0%;
    background:var(--sc-accent);
    transition:width linear;
  }

  /* --- ARROWS --- */
  .sc-arrows{
    position:absolute;
    left:55%;
    bottom:-80px;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
    justify-content:center;
  }
  .sc-arrow{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.25s;
    border:2px solid var(--sc-accent);
    color:var(--sc-accent);
    background:#fff;
  }
  .sc-arrow svg{width:20px;height:20px}
  .sc-arrow:hover{background:var(--sc-accent);color:#fff}

  /* Responsive */
  @media(max-width:992px){
    .sc-slide{grid-template-columns:1fr;gap:20px;}
    .sc-media{height:220px}
    .sc-title{font-size:22px}
    .sc-desc{font-size:15px}
    .sc-indicator{flex-wrap:wrap}
    .sc-arrows{flex-direction:row;bottom:-70px;}
  }
</style>
</head>
<body>

<section class="smartcity-slider">
  <div class="sc-slide">
    <!-- Image -->
    <figure class="sc-media">
      <img src="img/bannerabout.webp" alt="Smart Pole" class="sc-active" id="sc-img">
    </figure>

    <!-- Text -->
    <div class="sc-copy sc-active-text" id="sc-text">
      <h3 class="sc-title">Smart Pole</h3>
      <p class="sc-desc">
        Multi-functional poles with EV charging, CCTV, Wi-Fi, SOS, LED displays, and sensors — delivering smarter, connected, safer cities.
      </p>
      <!-- Smart City Indicators -->
      <div class="sc-indicator" id="sc-indicator"></div>
      <!-- Progress Bar -->
      <div class="sc-progress-bar"><div class="sc-progress-fill" id="sc-progress"></div></div>
    </div>

    <!-- Arrows -->
    <div class="sc-arrows">
      <button class="sc-arrow sc-prev" onclick="scPrev()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
      </button>
      <button class="sc-arrow sc-next" onclick="scNext()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
    </div>
  </div>
</section>

<script>
const scSlides = [
  {
    img: "img/bannerabout.webp",
    title: "Smart Pole",
    desc: "Multi-functional poles with EV charging, CCTV, Wi-Fi, SOS, LED displays, and sensors — delivering smarter, connected, safer cities.",
    icon: "Smart Pole"
  },
  {
    img: "img/carousel-1.webp",
    title: "Smart Bollard",
    desc: "Retractable or fixed bollards with lighting, traffic control, and surveillance for secure urban environments.",
    icon: "Bollard"
  }
];

let scIndex=0;
const scImg=document.getElementById("sc-img");
const scText=document.getElementById("sc-text");
const scProgress=document.getElementById("sc-progress");
const scIndicator=document.getElementById("sc-indicator");

// create indicators
scSlides.forEach((s,i)=>{
  const span=document.createElement("span");
  span.textContent=s.icon;
  if(i===0) span.classList.add("sc-active");
  scIndicator.appendChild(span);
});

function scUpdateIndicators(){
  [...scIndicator.children].forEach((el,i)=>{
    el.classList.toggle("sc-active", i===scIndex);
  });
}

function scAnimateProgress(){
  scProgress.style.transition="none";
  scProgress.style.width="0%";
  setTimeout(()=>{
    scProgress.style.transition="width 5s linear";
    scProgress.style.width="100%";
  },50);
}

function scShow(i){
  scIndex=(i+scSlides.length)%scSlides.length;

  scImg.classList.remove("sc-active");
  scText.classList.remove("sc-active-text");

  setTimeout(()=>{
    scImg.src=scSlides[scIndex].img;
    scText.querySelector(".sc-title").textContent=scSlides[scIndex].title;
    scText.querySelector(".sc-desc").textContent=scSlides[scIndex].desc;
    scImg.classList.add("sc-active");
    scText.classList.add("sc-active-text");
    scUpdateIndicators();
    scAnimateProgress();
  },150); 
}

function scNext(){ scShow(scIndex+1); }
function scPrev(){ scShow(scIndex-1); }

// auto play
setInterval(()=> scNext(), 5000);
scAnimateProgress();
</script>

</body>
</html>
