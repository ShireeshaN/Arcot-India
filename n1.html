<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Up Your Space</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #fff;
      color: #000;
      font-family: Arial, sans-serif;
    }

    .left-image {
      width: 100%;
      height: 70vh; /* shorter height, wide image */
      object-fit: cover;
      margin-top: 50px; /* 👈 moves image a bit down */
    }

    .text-section {
      padding-left: 3rem; /* keep gap from image */
      padding-right: 2rem;
    }

    .heading {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .tagline {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 0.8rem;
    }

    .desc {
      color: #555;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .icon-box {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .icon-box.active,
    .icon-box:hover {
      background: #000;
      color: #fff;
      transform: scale(1.1);
    }

    .icon-title {
      margin-top: 0.6rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .icon-sub {
      font-size: 0.8rem;
      color: #777;
    }

    /* Fade animation for image */
    .fade {
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .fade.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row align-items-start">
      <!-- Left side image -->
      <div class="col-md-6 p-0 d-flex align-items-start justify-content-center">
        <img id="mainImage" src="https://source.unsplash.com/900x500/?home,interior" class="left-image show fade" alt="">
      </div>

      <!-- Right side text and icons -->
      <div class="col-md-6 d-flex flex-column justify-content-start pt-5 text-section">
        <h1 class="heading">Light Up Your Space</h1>
        <h3 class="tagline">點亮空間，尋找燈的美麗</h3>
        <p id="mainDesc" class="desc">
          從生活空間開始激盪新的照明想法，透過我們的推薦，盡情享受光氛圍營造的悠閒時光！
        </p>

        <!-- Icon Grid -->
        <div class="row text-center g-4">
          <div class="col-4" onmouseenter="setActive(0)">
            <div class="icon-box active" id="icon0">
              <i class="bi bi-house-door fs-3"></i>
            </div>
            <p class="icon-title">居家空間</p>
            <p class="icon-sub">Home space</p>
          </div>

          <div class="col-4" onmouseenter="setActive(1)">
            <div class="icon-box" id="icon1">
              <i class="bi bi-building fs-3"></i>
            </div>
            <p class="icon-title">商業空間</p>
            <p class="icon-sub">Commercial</p>
          </div>

          <div class="col-4" onmouseenter="setActive(2)">
            <div class="icon-box" id="icon2">
              <i class="bi bi-laptop fs-3"></i>
            </div>
            <p class="icon-title">辦公室&教室空間</p>
            <p class="icon-sub">Office & School</p>
          </div>

          <div class="col-4" onmouseenter="setActive(3)">
            <div class="icon-box" id="icon3">
              <i class="bi bi-lightbulb fs-3"></i>
            </div>
            <p class="icon-title">照明設計</p>
            <p class="icon-sub">Lighting Design</p>
          </div>

          <div class="col-4" onmouseenter="setActive(4)">
            <div class="icon-box" id="icon4">
              <i class="bi bi-shop fs-3"></i>
            </div>
            <p class="icon-title">商店空間</p>
            <p class="icon-sub">Shops</p>
          </div>

          <div class="col-4" onmouseenter="setActive(5)">
            <div class="icon-box" id="icon5">
              <i class="bi bi-bank fs-3"></i>
            </div>
            <p class="icon-title">公共場所</p>
            <p class="icon-sub">Public Space</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <script>
    const items = [
      {
        img: "https://source.unsplash.com/900x500/?home,interior",
        desc: "為您的生活空間帶來舒適與溫暖的燈光氛圍。"
      },
      {
        img: "https://source.unsplash.com/900x500/?office,building",
        desc: "提升商業場域的專業感與吸引力。"
      },
      {
        img: "https://source.unsplash.com/900x500/?classroom,workspace",
        desc: "讓學習與工作的環境更高效與舒適。"
      },
      {
        img: "https://source.unsplash.com/900x500/?lamp,design",
        desc: "專業照明設計，打造獨特風格與氛圍。"
      },
      {
        img: "https://source.unsplash.com/900x500/?shop,interior",
        desc: "商店空間更亮眼，吸引顧客目光。"
      },
      {
        img: "https://source.unsplash.com/900x500/?hall,public",
        desc: "公共空間的最佳照明解決方案。"
      }
    ];

    let activeIndex = 0;
    let interval = setInterval(nextSlide, 4000);

    function setActive(index) {
      activeIndex = index;
      updateUI();
      resetTimer();
    }

    function nextSlide() {
      activeIndex = (activeIndex + 1) % items.length;
      updateUI();
    }

    function updateUI() {
      const image = document.getElementById("mainImage");
      const desc = document.getElementById("mainDesc");

      // Fade transition
      image.classList.remove("show");
      setTimeout(() => {
        image.src = items[activeIndex].img;
        desc.textContent = items[activeIndex].desc;
        image.classList.add("show");
      }, 200);

      // update icons
      for (let i = 0; i < items.length; i++) {
        document.getElementById("icon" + i).classList.remove("active");
      }
      document.getElementById("icon" + activeIndex).classList.add("active");
    }

    function resetTimer() {
      clearInterval(interval);
      interval = setInterval(nextSlide, 4000);
    }
  </script>
</body>
</html>
