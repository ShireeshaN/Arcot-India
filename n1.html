<!-- SMARTPOLE FEATURE SECTION -->
<section class="smartpole-section" id="smartpole">

  <div class="features-container">
    <div class="features-list" id="featuresLeft"></div>

    <div class="product-display" id="imageContainer">
      <!-- Single common image for all features -->
      <img src="img/randd/Smartpole-product-removebg-preview.png" class="product-image active" alt="Smartpole Product">
    </div>

    <div class="features-list" id="featuresRight"></div>
  </div>
</section>

<script>
// FEATURES WITH ICONS
const features = [
  {icon:"⚡", name:"EV Charger", desc:"Fast, efficient EV charging; solar/wind integration and QR payments."},
  {icon:"🚨", name:"Emergency SOS Alert", desc:"Instant SOS with GPS, voice/push activation and ICCC integration."},
  {icon:"🔌", name:"Wired Charging", desc:"Weatherproof, safe plug-and-charge with real-time power & metering."},
  {icon:"📡", name:"Wireless Charging", desc:"Contactless EV charging for convenient public/fleet use."},
  {icon:"🌫️", name:"Air Quality Sensor", desc:"Real-time PM/CO₂/NO₂ monitoring with IoT reporting and alerts."},
  {icon:"📊", name:"Air Quality Screen", desc:"Outdoor AQI display with auto-brightness and public alerts."},
  {icon:"💡", name:"Street Lighting", desc:"Smart dimmable LEDs with motion, schedules and solar option."},
  {icon:"🔊", name:"PA Loudspeaker", desc:"Weatherproof public address for alerts, announcements and events."},
  {icon:"⚙️", name:"Power Generation System", desc:"Solar/wind hybrid generation with battery storage."},
  {icon:"🖥️", name:"RGB Pixel LED Screen", desc:"High-bright dynamic display for ads, alerts and info."},
  {icon:"👁️", name:"Motion Detector", desc:"Day/night movement detection that triggers lights/cameras."},
  {icon:"📶", name:"Wi-Fi Hotspot", desc:"Public broadband access and IoT connectivity with secure access."},
  {icon:"🎙️", name:"Intercom", desc:"Two-way citizen ↔ control center communication (audio/video)."},
  {icon:"📱", name:"Android Touch Screen", desc:"Outdoor info kiosk: maps, tickets, navigation & services."},
  {icon:"🗣️", name:"AI-Based Voice Communication", desc:"Multilingual voice assistant for info and commands."},
  {icon:"🎥", name:"AI-Based Camera", desc:"Smart video analytics (detection, ANPR, alerts) with edge/cloud support."},
];

const leftContainer = document.getElementById('featuresLeft');
const rightContainer = document.getElementById('featuresRight');
const leftFeatures = features.slice(0, 8);
const rightFeatures = features.slice(8, 16);

function createFeatureElement(f, i) {
  const div = document.createElement('div');
  div.classList.add('feature');
  div.innerHTML = `
    <div class="feature-header">
      <span class="feature-icon">${f.icon}</span>
      <span class="feature-title">${f.name}</span>
    </div>
    <div class="feature-desc">${f.desc}</div>
  `;
  return div;
}

leftFeatures.forEach(f => leftContainer.appendChild(createFeatureElement(f)));
rightFeatures.forEach(f => rightContainer.appendChild(createFeatureElement(f)));

gsap.registerPlugin(ScrollTrigger);

// Scroll animations
gsap.to(".smartpole-section", {
  opacity: 1, y: 0, duration: 1.2, ease: "power3.out",
  scrollTrigger: { trigger: ".smartpole-section", start: "top 80%" }
});

gsap.from(".features-list", {
  opacity: 0,
  x: i => (i === 0 ? -100 : 100),
  duration: 1.3,
  stagger: 0.2,
  ease: "power2.out",
  scrollTrigger: { trigger: ".features-container", start: "top 85%" }
});
</script>
