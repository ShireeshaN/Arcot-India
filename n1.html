<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured Own Brands</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .hero-heading {
      font-size: 2.8rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hero-tagline {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 20px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #333;
      margin-bottom: 25px;
    }

    .hero-subheading {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .hero-desc {
      font-size: 1rem;
      color: #444;
      margin-bottom: 20px;
    }

    .hero-more {
      text-decoration: none;
      font-weight: bold;
      color: #111;
      border-bottom: 2px solid #333;
      padding-bottom: 3px;
      transition: 0.3s;
    }

    .hero-more:hover {
      color: #555;
      border-color: #555;
    }

    .nav-btn {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .nav-btn:hover {
      background: #eee;
    }

    /* Image */
    .image-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }

    .hero-img {
      width: 100%;
      height: 80vh; /* big height */
      object-fit: cover;
      animation: kenburns 14s ease-in-out infinite;
      opacity: 0;
      transition: opacity .7s ease;
    }

    .hero-img.active {
      opacity: 1;
    }

    @keyframes kenburns {
      0%   {transform: scale(1.05);}
      50%  {transform: scale(1.1);}
      100% {transform: scale(1.05);}
    }

    /* Fade for text */
    .fade {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .fade.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mobile */
    @media (max-width: 991.98px){
      .hero-img {height: 60vh;} /* taller mobile too */
      .hero-heading {font-size: 2rem;}
    }
  </style>
</head>
<body>

<div class="container-fluid py-5">
  <div class="row align-items-center">
    
    <!-- Text -->
    <div class="col-lg-5 col-md-12 fade show" id="slideText">
      <h1 class="hero-heading">Featured Own Brands</h1>
      <p class="hero-tagline">Showcasing our research & developed products</p>
      <div class="divider"></div>
      <h3 class="hero-subheading" id="subHeading">Home Automation</h3>
      <p class="hero-desc" id="desc">
        Control lighting, temperature, and security systems for residential intelligence.
      </p>
      <a href="#" class="hero-more">+ more</a>
      <div class="mt-4 d-flex gap-3">
        <button class="nav-btn prev"><i class="fas fa-arrow-left"></i></button>
        <button class="nav-btn next"><i class="fas fa-arrow-right"></i></button>
      </div>
    </div>

    <!-- Image -->
    <div class="col-lg-7 col-md-12">
      <div class="image-wrapper">
        <img src="img/carousel-1.webp" alt="Slide" class="hero-img active" id="slideImage">
      </div>
    </div>

  </div>
</div>

<!-- JS -->
<script>
  const slides = [
    {
      img: "img/carousel-1.webp",
      heading: "Home Automation",
      desc: "Control lighting, temperature, and security systems for residential intelligence."
    },
    {
      img: "img/bannerabout.webp",
      heading: "Commercial Automation",
      desc: "High-performance office environments for intelligent control and energy efficiency."
    },
    {
      img: "img/carousel-1.webp",
      heading: "Industrial Automation",
      desc: "Boost productivity and safety with next-gen Industry 4.0 automation."
    },
    {
      img: "img/bannerabout.webp",
      heading: "Hospital Automation",
      desc: "Smart hospital facility management for safety and operational efficiency."
    },
    {
      img: "img/carousel-1.webp",
      heading: "IoT Automation",
      desc: "Connect devices and data to create a complete intelligent ecosystem."
    },
    {
      img: "img/bannerabout.webp",
      heading: "Hotel Automation",
      desc: "Deliver seamless and personalized experiences for guests."
    }
  ];

  let currentIndex = 0;
  const imageEl = document.getElementById("slideImage");
  const subHeading = document.getElementById("subHeading");
  const desc = document.getElementById("desc");
  const textBox = document.getElementById("slideText");

  function showSlide(index){
    const slide = slides[index];
    imageEl.classList.remove("active");
    textBox.classList.remove("show");

    setTimeout(()=>{
      imageEl.src = slide.img;
      subHeading.textContent = slide.heading;
      desc.textContent = slide.desc;

      imageEl.classList.add("active");
      textBox.classList.add("show");
    },500);
  }

  document.querySelector(".prev").addEventListener("click", ()=>{
    currentIndex = (currentIndex - 1 + slides.length) % slides.length;
    showSlide(currentIndex);
  });

  document.querySelector(".next").addEventListener("click", ()=>{
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  });

  // Auto change
  setInterval(()=>{
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  }, 6000);
</script>

</body>
</html>
