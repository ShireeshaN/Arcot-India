<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Website Prototype</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Basic Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Arial', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      position: fixed;
      width: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
    }

    header a { color: #fff; text-decoration: none; margin: 0 15px; }

    main {
      padding-top: 100px;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      text-align: center;
    }

    .hero h1 {
      font-size: 4rem;
      transform: rotateY(0deg);
      transition: transform 1s ease;
    }

    .hero:hover h1 {
      transform: rotateY(20deg);
    }

    /* 3D Cards Section */
    .cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      padding: 50px 20px;
    }

    .card {
      background: #111;
      padding: 30px;
      border-radius: 20px;
      width: 250px;
      text-align: center;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }

    .card:hover {
      transform: rotateY(15deg) rotateX(10deg) scale(1.05);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 40px 0;
      background: #111;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">3DBrand</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Hero Section -->
    <section class="hero" id="home">
      <h1>3D Interactive Website</h1>
    </section>

    <!-- Cards Section -->
    <section class="cards" id="services">
      <div class="card">
        <img src="https://via.placeholder.com/250x150" alt="Service 1">
        <h3>Service 1</h3>
        <p>Awesome 3D effect for your website.</p>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/250x150" alt="Service 2">
        <h3>Service 2</h3>
        <p>Modern interactive design for users.</p>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/250x150" alt="Service 3">
        <h3>Service 3</h3>
        <p>Highly responsive and flexible layout.</p>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 3DBrand. All Rights Reserved.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Optional: small JS animation
    const heroText = document.querySelector('.hero h1');
    let angle = 0;
    setInterval(() => {
      angle += 0.5;
      heroText.style.transform = `rotateY(${angle}deg)`;
    }, 50);
  </script>

</body>
</html>
