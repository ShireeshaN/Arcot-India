<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Lighting Concepts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    /* * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Poppins", sans-serif;
      background-color: #fff;
      color: #000;
      overflow-x: hidden;
    } */

    .rd-wrapper {
      display: flex;
      align-items: stretch;
      height: 100vh;
      width: 100%;
      overflow-x: hidden;
      background-color: #fff;
      color: #000;
    }

    /* LEFT SECTION */
    .rd-text-section {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 4rem 3rem;
    }

    .rd-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
    }

    .rd-text-content { flex: 1; padding-right: 2rem; }

    .rd-headline {
      font-size: 3.2rem;
      font-weight: 600;
      color: #514f4f;
    }

    .rd-subheadline {
      font-size: 3.2rem;
      color: #cfcfcf;
      font-weight: 300;
      margin-top: -10px;
    }

    .rd-desc {
      color: #777;
      max-width: 380px;
      margin: 25px 0;
      line-height: 1.7;
    }

    .rd-read-more {
      color: #535151;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid #000;
    }

    .rd-page-count {
      font-size: 1rem;
      color: #aaa;
      margin-top: 1.5rem;
    }

    /* Thumbnails */
    .rd_thumbs {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: flex-end;
    }

    .rd_thumbs img {
      width: 85px;
      height: 110px;
      object-fit: cover;
      filter: grayscale(100%);
      transition: 0.3s ease;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 6px;
    }

    .rd_thumbs img.active {
      filter: grayscale(0%);
      border: 3px solid #171616;
    }

    .rd_thumbs img:hover {
      filter: grayscale(0%);
      transform: scale(1.05);
    }

    /* RIGHT SECTION */
    .rd_image_section {
      width: 50%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: #f3f3f3;
      overflow: hidden;
    }

    .rd_image_wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
      transition: opacity 0.8s ease-in-out;
    }

    .rd_red_line {
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      height: 100px;
      background-color: #cfcfcf;
    }

    /* Red Box */
    .rd_red_box {
      width: 100%;
      background-color: #000000;
      color: #918b8b;
      padding: 2.5rem 3rem;
      text-align: right;
    }

    .rd_red_box h4 {
      margin: 0;
      font-weight: 500;
      font-size: 1.5rem;
    }

    .rd_red_box p {
      margin-top: 5px;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    /* Arrow button */
    .arrow-btn {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 60px;
      height: 80px;
      /* background-color: #000; */
      color: #d5d0d0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.5rem;
      border-radius: 50%;
    }

    @media (max-width: 992px) {
      .rd-wrapper {
        flex-direction: column;
        height: auto;
      }

      .rd-text-section, .rd_image_section {
        width: 100%;
        padding: 2rem;
      }

      .rd_thumbs {
        flex-direction: row;
        justify-content: center;
        margin-top: 2rem;
      }

      .rd_red_box {
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="rd-wrapper">
    <!-- LEFT SECTION -->
    <div class="rd-text-section">
      <div class="rd-content">
        <div class="rd-text-content">
          <h1 class="rd-headline">Research &</h1>
          <h1 class="rd-subheadline">Development</h1>
          <p class="rd-desc">
            At Arcot India, innovation isn’t a department — it’s our DNA.
            Our R&D division stands at the crossroads of technology, design, and sustainability, redefining how cities think, connect, and evolve.
          </p>
          <a href="#" class="rd-read-more">explore more</a>
          <p class="rd-page-count">01/05</p>
        </div>

        <div class="rd_thumbs">
          <img src="img/randd/smartpole.png" data-main="img/randd/smartpole.png" alt="Ambient Lights" class="active" />
          <img src="img/randd/smartbollad.png" data-main="img/randd/smartbollad.png" alt="Mood Lighting" />
          <img src="img/randd/smarttable.png" data-main="img/randd/smarttable.png" alt="Architectural Glow" />
          <img src="img/randd/Bar-counter-1.jpg" data-main="img/randd/Bar-counter-5.jpg" alt="Outdoor Lighting" />
          <img src="img/comingsoon-2.jpg" data-main="img/comingsoon-2.jpg" alt="Smart Urban Light" />
        </div>
      </div>
    </div>

    <!-- RIGHT SECTION -->
    <div class="rd_image_section">
      <div class="rd_image_wrapper">
        <div class="rd_red_line"></div>
        <img src="img/randd/smartpole.png" class="main-img" alt="Main Lighting Image" />
        
      </div>

      <div class="rd_red_box">
        <h4>Smart Pole</h4>
        <p>Where Connectivity Meets Design</p>
        <div class="arrow-btn">→</div>
      </div>
    </div>
  </div>

  <script>
    const rd_thumbs = document.querySelectorAll(".rd_thumbs img");
    const mainImg = document.querySelector(".main-img");
    const pageCount = document.querySelector(".rd-page-count");
    const redTitle = document.querySelector(".rd_red_box h4");
    const redText = document.querySelector(".rd_red_box p");
    const arrowBtn = document.querySelector(".arrow-btn");

    const captions = [
      { title: "Smart Pole", text: "Where Connectivity Meets Design" },
      { title: "Smart Bollard", text: "Grounded in Design. Driven by Data" },
      { title: "Smart Conference Table", text: "Where Collaboration Meets Intelligence" },
      { title: "Smart Bar Counter", text: "Where Design Pours Innovation" },
      { title: "Smart Window Leaf AC", text: "Reinventing Air. Intelligently" }
    ];

    let index = 0;
    const total = rd_thumbs.length;

    function showImage(i) {
      rd_thumbs.forEach((thumb) => thumb.classList.remove("active"));
      rd_thumbs[i].classList.add("active");
      mainImg.style.opacity = 0;
      setTimeout(() => {
        mainImg.src = rd_thumbs[i].getAttribute("data-main");
        mainImg.style.opacity = 1;
      }, 400);
      redTitle.textContent = captions[i].title;
      redText.textContent = captions[i].text;
      pageCount.textContent = `0${i + 1}/0${total}`;
      index = i;
    }

    rd_thumbs.forEach((thumb, i) => {
      thumb.addEventListener("click", () => showImage(i));
    });

    arrowBtn.addEventListener("click", () => {
      index = (index + 1) % total;
      showImage(index);
    });

    // Auto-scroll every 4 seconds
    setInterval(() => {
      index = (index + 1) % total;
      showImage(index);
    }, 4000);
  </script>
</body>
</html>
