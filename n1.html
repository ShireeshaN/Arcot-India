<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Renewable Energy Sources</title>
 <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: row;
    height: 100vh;
    overflow: hidden;
  }

  /* Left Section */
  .left-section {
    width: 35%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 2;
  }
  .left-text h2 {
    font-size: 32px;
    margin-bottom: 10px;
  }
  .left-text p {
    font-size: 16px;
    line-height: 1.6;
  }
  .glass-btn {
    margin-top: 20px;
    padding: 10px 20px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15);
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
    text-decoration: none;
  }
  .glass-btn:hover {
    background: rgba(133, 136, 135, 0.25);
    transform: scale(1.05);
    box-shadow: 0 0 10px #fff;
  }

  /* Arc container */
  .arc-container {
    position: absolute;
    left: 35%;
    top: 50%;
    transform: translateY(-50%);
    width: 600px;
    height: 700px;
    z-index: 3;
    pointer-events: none;
  }
  svg.arcs {
    position: absolute;
    top: 0;
    left: -550px;
    width: 600px;
    height: 700px;
  }

  /* Icons */
  .icon {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(34,34,34,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
    cursor: pointer;
    z-index: 4;
    transition: all 0.3s ease;
  }
  .icon:hover { transform: scale(1.2); }
  .icon.active { 
    background: rgba(101,103,102,0.7);
    border-color: #6f7271;
    animation: pulse 1.5s infinite, spin 0.6s ease;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 5px #727372; }
    50% { box-shadow: 0 0 20px #727372, 0 0 40px rgba(127,128,127,0.7); }
    100% { box-shadow: 0 0 5px #727372; }
  }
  @keyframes spin { from { transform: rotate(0deg) scale(1.15); } to { transform: rotate(360deg) scale(1.15); } }

  /* Right Image */
  .right-bg {
    position: absolute;
    top: 0;
    right: 0;
    width: 80%;
    height: 100%;
    z-index: 1;
  }
  .right-bg svg, .right-bg image { width: 100%; height: 100%; }

  /* Mobile view */
  @media (max-width: 1023px) {
    body { flex-direction: column; height: auto; overflow-y: auto; }
    .left-section { width: 100%; order: 2; text-align: center; }
    .left-text h2 { font-size: 24px; }
    .left-text p { font-size: 14px; }
    .arc-container { display: none; }
    .right-bg { order: 1; position: relative; width: 100%; height: 260px; }
    .right-bg svg, .right-bg image { width: 100%; height: 100%; object-fit: cover; }
    .mobile-icons { display: flex; justify-content: center; gap: 15px; margin: 15px 0; overflow-x: auto; padding: 10px; }
    .mobile-icons .icon { position: relative; left: unset !important; top: unset !important; transform: none !important; }
  }
 </style>
</head>
<body>

  <!-- Left Section -->
  <div class="left-section">
    <div class="left-text" id="leftText">
      <h2>Renewable Energy</h2>
      <p>Harnessing clean and sustainable sources of energy to power our future.</p>
      <a href="#" class="glass-btn">Read More</a>
    </div>
  </div>

  <!-- Middle arcs -->
  <div class="arc-container">
    <svg class="arcs" viewBox="0 0 600 700">
      <path id="outerArc" d="M500 50 A450 450 0 0 1 500 650" stroke="#666" stroke-width="2"/>
    </svg>
  </div>

  <!-- Mobile icons -->
  <div class="mobile-icons"></div>

  <!-- Right background image -->
  <div class="right-bg">
    <svg viewBox="0 0 1920 700" preserveAspectRatio="xMidYMid slice">
      <defs>
        <clipPath id="arcClip" clipPathUnits="userSpaceOnUse">
          <path d="M500 50 A450 450 0 0 1 500 650 L1920 650 L1920 50 Z" />
        </clipPath>
      </defs>
      <image id="bgImage" href="https://picsum.photos/id/1015/1920/1080" clip-path="url(#arcClip)" />
    </svg>
  </div>

  <script>
    const data = [
      { title: "Solar Energy", desc: "Solar panels capture sunlight and convert it into clean electricity.", icon: "☀️", bg: "https://picsum.photos/id/1011/1920/1080" },
      { title: "Wind Power", desc: "Wind turbines harness the power of moving air to generate electricity.", icon: "🌬️", bg: "https://picsum.photos/id/1018/1920/1080" },
      { title: "Biomass Energy", desc: "Organic matter such as plants and waste is used to produce energy sustainably.", icon: "🌱", bg: "https://picsum.photos/id/1025/1920/1080" },
      { title: "Hydel Power", desc: "Hydropower plants generate electricity by using flowing water.", icon: "💧", bg: "https://picsum.photos/id/1031/1920/1080" }
    ];

    // Desktop icons on arc
    const arcPath = document.getElementById("outerArc");
    const arcLength = arcPath.getTotalLength();
    const container = document.querySelector(".arc-container");
    data.forEach((d, i) => {
      const point = arcPath.getPointAtLength((arcLength / (data.length - 1)) * i);
      const icon = document.createElement("div");
      icon.className = "icon";
      icon.dataset.index = i;
      icon.textContent = d.icon;
      const shiftX = -550;
      icon.style.left = `${point.x + shiftX - 30}px`;
      icon.style.top = `${point.y - 30}px`;
      container.appendChild(icon);
    });

    const icons = document.querySelectorAll(".icon");
    const leftText = document.getElementById("leftText");
    const bgImage = document.getElementById("bgImage");
    let current = 0;

    function setActive(index) {
      document.querySelectorAll(".icon").forEach(i => i.classList.remove("active"));
      document.querySelectorAll(".icon")[index].classList.add("active");
      leftText.innerHTML = `<h2>${data[index].title}</h2><p>${data[index].desc}</p><a href='#' class='glass-btn'>Read More</a>`;
      bgImage.setAttribute("href", data[index].bg);
      current = index;
    }

    icons.forEach((icon, i) => { icon.addEventListener("click", () => setActive(i)); });

    // Mobile icons bar
    const mobileBar = document.querySelector(".mobile-icons");
    data.forEach((d, i) => {
      const icon = document.createElement("div");
      icon.className = "icon";
      icon.textContent = d.icon;
      icon.dataset.index = i;
      icon.addEventListener("click", () => setActive(i));
      mobileBar.appendChild(icon);
    });

    setInterval(() => { let next = (current + 1) % data.length; setActive(next); }, 5000);
    setActive(0);
  </script>
</body>
</html>
