<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Black & White Accordion</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .energygenss {
      display: flex;
      width: 95%;
      max-width: 1200px;
      height: 420px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);

    }

    .energygenss-item {
      flex: 1; /* smaller default */
      min-width: 40px;
      background-size: cover;
      background-position: center;
      transition: flex 0.6s ease, filter 0.6s ease, transform 0.6s ease, height 0.6s ease;
      cursor: pointer;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      filter: grayscale(100%) brightness(0.7);
    }

    .energygenss-item::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.25);
      transition: background 0.4s ease;
    }

    .energygenss-item span {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 22px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 2;
    }

    .energygenss-item.active {
      flex: 7; /* big main image */
      filter: grayscale(0%) brightness(1);
      transform: scale(1.02);
    }

    .energygenss-item.active::after {
      background: rgba(0,0,0,0.05);
    }

    .energygenss-item.active span {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mobile accordion style */
    @media (max-width: 768px) {
      .energygenss {
        flex-direction: column;
        height: auto;
      }
      .energygenss-item {
        flex: none;
        width: 100%;
        height: 70px; /* collapsed smaller */
        overflow: hidden;
      }
      .energygenss-item.active {
        height: 280px; /* expanded bigger */
        flex: none;
        transform: none;
      }
      .energygenss-item span {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="energygenss">
    <div class="energygenss-item" style="background-image: url('img/application/appli (2).webp');">
      <span>Mountain View</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/application/appli (3).webp');">
      <span>Forest</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/application/appli (4).webp');">
      <span>Lake</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/segmentimgs/commercial-auto.webp');">
      <span>Desert</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/segmentimgs/iot-auto.webp');">
      <span>Beach</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/segmentimgs/lights1 (9).webp');">
      <span>Snow</span>
    </div>
    <div class="energygenss-item" style="background-image: url('img/bannerabout.webp');">
      <span>Valley</span>
    </div>
    <div class="energygenss-item" style="background-image: url('https://picsum.photos/id/1056/600/400');">
      <span>River</span>
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.energygenss-item');
    let currentIndex = 0;
    const intervalTime = 4000;

    function activateItem(index) {
      items.forEach((item, i) => {
        item.classList.remove('active');
        if (i === index) item.classList.add('active');
      });
    }

    // Desktop auto-slide
    function startAutoSlide() {
      return setInterval(() => {
        currentIndex = (currentIndex + 1) % items.length;
        activateItem(currentIndex);
      }, intervalTime);
    }

    let autoSlide = startAutoSlide();

    // Click control
    items.forEach((item, index) => {
      item.addEventListener('click', () => {
        currentIndex = index;
        activateItem(currentIndex);

        if (window.innerWidth > 768) {
          clearInterval(autoSlide);
          autoSlide = startAutoSlide();
        }
      });
    });

    // Mobile → disable auto-slide
    function checkMobile() {
      if (window.innerWidth <= 768) {
        clearInterval(autoSlide);
      }
    }

    window.addEventListener('resize', checkMobile);
    checkMobile();

    // Start with first active
    activateItem(currentIndex);
  </script>

</body>
</html>
