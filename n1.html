<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartPole Features Slider</title>

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: #fff;
  color: #111;
  overflow-x: hidden;
}

/* Container */
.feature-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100vh;
  padding: 0 60px;
  box-sizing: border-box;
  position: relative;
}

/* Left text box */
.text-content {
  width: 45%;
  position: relative;
}

.text-content h5 {
  font-size: 14px;
  text-transform: uppercase;
  font-weight: 400;
  margin-bottom: 10px;
  letter-spacing: 0.05em;
  position: relative;
}

.text-content h5::after {
  content: "";
  display: block;
  width: 350px;
  height: 1px;
  background: #000;
  margin-top: 8px;
}

.text-content h2 {
  font-size: 26px;
  text-transform: uppercase;
  margin: 20px 0;
  font-weight: 700;
}

.text-content p {
  font-size: 14px;
  line-height: 1.7;
  color: #333;
  margin-bottom: 60px;
}

/* bottom line */
.text-content::after {
  content: "";
  display: block;
  width: 80%;
  height: 1px;
  background: #000;
  margin-top: 50px;
}

/* Image container */
.image-container {
  width: 50%;
  overflow: hidden;
  position: relative;
  height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
  transition: transform 0.8s ease-in-out;
}

.image-container:hover img {
  transform: scale(1.03);
}

/* Navigation buttons */
.nav-btn {
  position: absolute;
  top: 90%;
  transform: translateY(-50%);
  background: #111;
  color: #fff;
  border: none;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  z-index: 5;
  transition: 0.3s ease;
}

.nav-btn:hover {
  background: #333;
}

#prevBtn {
  left: 380px;
}

#nextBtn {
  right: 800px;
}

/* Dots navigation */
.dots {
  position: absolute;
  bottom: 60px;
  left: 35%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

.dots span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #111;
  opacity: 0.4;
  cursor: pointer;
  transition: 0.3s;
}

.dots span.active {
  opacity: 1;
  background: #ffcc00;
}
</style>
</head>

<body>
<section class="feature-section">
  <div class="text-content" id="text-content">
    <h5>Feature</h5>
    <h2>Smart Lighting</h2>
    <p>
      AI-powered adaptive street lighting that adjusts brightness automatically 
      based on movement and environmental conditions for energy efficiency.
    </p>
  </div>

  <div class="image-container">
    <img id="featureImage" src="https://images.unsplash.com/photo-1581091870633-7ccfa0f3c3b3?auto=format&fit=crop&w=1000&q=80" alt="Feature Image">
  </div>

  <button class="nav-btn" id="prevBtn">&#8592;</button>
  <button class="nav-btn" id="nextBtn">&#8594;</button>

  <div class="dots" id="dots"></div>
</section>

<script>
const features = [
  {
    title: "Smart Lighting",
    desc: "AI-powered adaptive street lighting that adjusts brightness automatically based on movement and environmental conditions for energy efficiency.",
    img: "https://images.unsplash.com/photo-1581091870633-7ccfa0f3c3b3?auto=format&fit=crop&w=1000&q=80"
  },
  {
    title: "Environmental Monitoring",
    desc: "Tracks air quality, temperature, humidity, and noise levels in real time for smart city applications.",
    img: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1000&q=80"
  },
  {
    title: "Traffic Analytics",
    desc: "Uses AI-based video analytics to monitor vehicle flow, detect congestion, and improve traffic management.",
    img: "https://images.unsplash.com/photo-1517949908112-7201cc1261c7?auto=format&fit=crop&w=1000&q=80"
  },
  {
    title: "Public Wi-Fi Hotspot",
    desc: "Integrated Wi-Fi access points provide connectivity for citizens and IoT devices in smart cities.",
    img: "https://images.unsplash.com/photo-1504386106331-3e4e71712b38?auto=format&fit=crop&w=1000&q=80"
  }
];

let index = 0;
const imgEl = document.getElementById("featureImage");
const textEl = document.getElementById("text-content");
const dotsEl = document.getElementById("dots");

function updateFeature() {
  const f = features[index];
  imgEl.src = f.img;
  textEl.innerHTML = `
    <h5>Feature</h5>
    <h2>${f.title}</h2>
    <p>${f.desc}</p>
  `;
  document.querySelectorAll(".dots span").forEach((dot, i) => {
    dot.classList.toggle("active", i === index);
  });
}

features.forEach((_, i) => {
  const dot = document.createElement("span");
  dot.addEventListener("click", () => {
    index = i;
    updateFeature();
  });
  dotsEl.appendChild(dot);
});

document.getElementById("nextBtn").onclick = () => {
  index = (index + 1) % features.length;
  updateFeature();
};

document.getElementById("prevBtn").onclick = () => {
  index = (index - 1 + features.length) % features.length;
  updateFeature();
};

let autoScroll = setInterval(() => {
  index = (index + 1) % features.length;
  updateFeature();
}, 3500);

document.querySelector(".feature-section").addEventListener("mouseenter", () => {
  clearInterval(autoScroll);
});

document.querySelector(".feature-section").addEventListener("mouseleave", () => {
  autoScroll = setInterval(() => {
    index = (index + 1) % features.length;
    updateFeature();
  }, 3500);
});

updateFeature();
</script>
</body>
</html>
