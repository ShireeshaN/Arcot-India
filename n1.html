<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Energy Generation Slider</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <style>
    /* === BACKGROUND IMAGE === */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('img/WIND POWER (1).png') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    /* === OPTIONAL DARK OVERLAY FOR READABILITY === */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5); /* Adjust opacity as needed */
      z-index: -1;
    }

    .carousel-section {
      padding: 60px 0;
      overflow: hidden;
    }

    .carousel-title {
      color: white;
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 40px;
    }

    .swiper {
      padding: 0 80px 80px;
    }

    .swiper-slide {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .swiper-slide img {
      width: 100%;
      height: auto;
      display: block;
    }

    .swiper-button-prev,
    .swiper-button-next {
      color: #fff;
      background: rgba(255, 255, 255, 0.3);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      backdrop-filter: blur(5px);
      z-index: 1;
    }

    .swiper-button-prev:hover,
    .swiper-button-next:hover {
      background: white;
      color: #0074D9;
    }

    .swiper-button-next:after,
    .swiper-button-prev:after {
      font-size: 30px;
    }

    @media (max-width: 767px) {
      .carousel-title {
        font-size: 32px;
        margin-bottom: 20px;
      }

      .swiper {
        padding: 0 20px 60px;
      }

      .swiper-button-prev,
      .swiper-button-next {
        width: 30px;
        height: 30px;
      }

      .swiper-button-next:after,
      .swiper-button-prev:after {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <section class="carousel-section">
    <div class="carousel-title">TRENDING</div>

    <div class="swiper">
      <div class="swiper-wrapper">
        <!-- Slides -->
        <div class="swiper-slide">
          <img src="img/Untitled design.png" alt="Solar Energy">
        </div>
        <div class="swiper-slide">
          <img src="img/Untitled design.png" alt="Wind Energy">
        </div>
        <div class="swiper-slide">
          <img src="img/Untitled design.png" alt="Biomass Energy">
        </div>
        <div class="swiper-slide">
          <img src="img/Untitled design.png" alt="Hydel Power">
        </div>
      </div>

      <!-- Navigation -->
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>
  </section>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Swiper Initialization -->
  <script>
    const swiper = new Swiper('.swiper', {
      loop: true,
      centeredSlides: true,
      grabCursor: true,
      spaceBetween: 30,
      slidesPerView: 'auto',
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      breakpoints: {
        320: {
          spaceBetween: 20,
        },
        768: {
          spaceBetween: 30,
        },
        1024: {
          spaceBetween: 40,
        }
      }
    });
  </script>

</body>
</html>
