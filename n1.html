<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arcot Smart Pole</title>
<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: "SF Pro Display", Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}

/* Layout */
.smartpole-section {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  height: 100vh;
  padding: 40px 80px;
  box-sizing: border-box;
  position: relative;
}

.features-list {
  flex: 1;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 3;
}

.feature {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 50px;
  padding: 14px 24px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 1.1rem;
  font-weight: 500;
  position: relative;
}

.feature:hover {
  background: rgba(255, 255, 255, 0.25);
}

.feature.active {
  background: #fff;
  color: #000;
}

.feature-desc {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.4s ease;
  opacity: 0;
  font-size: 0.95rem;
  padding: 0 10px;
  margin-top: 4px;
  color: #ccc;
}

.feature.active .feature-desc {
  max-height: 200px;
  opacity: 1;
}

/* Right side image panel */
.product-display {
  flex: 1.2;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  height: 100%;
}

.product-image {
  position: absolute;
  width: 90%;
  height: 90%;
  object-fit: contain;
  opacity: 0;
  transform: scale(1.05);
  transition: opacity 0.8s ease, transform 1.2s ease;
}

.product-image.active {
  opacity: 1;
  transform: scale(1);
}

@media (max-width: 1024px) {
  .smartpole-section {
    flex-direction: column;
    padding: 40px 20px;
    text-align: center;
  }
  .features-list {
    max-width: 100%;
  }
  .product-display {
    height: 50vh;
  }
}
</style>
</head>
<body>

<section class="smartpole-section">
  <div class="features-list" id="features">
    <!-- Features will auto-populate below -->
  </div>

  <div class="product-display" id="imageContainer">
    <!-- Product images -->
    <img src="img/smartpole/ev-charger.jpg" class="product-image active" alt="EV Charger">
    <img src="img/smartpole/emergency-sos.jpg" class="product-image" alt="Emergency SOS">
    <img src="img/smartpole/wired-charging.jpg" class="product-image" alt="Wired Charging">
    <img src="img/smartpole/wireless-charging.jpg" class="product-image" alt="Wireless Charging">
    <img src="img/smartpole/air-sensor.jpg" class="product-image" alt="Air Quality Sensor">
    <img src="img/smartpole/aq-screen.jpg" class="product-image" alt="Air Quality Screen">
    <img src="img/smartpole/street-lighting.jpg" class="product-image" alt="Street Lighting">
    <img src="img/smartpole/pa.jpg" class="product-image" alt="PA Loudspeaker">
    <img src="img/smartpole/power-gen.jpg" class="product-image" alt="Power Generation System">
    <img src="img/smartpole/rgb-led.jpg" class="product-image" alt="RGB Pixel LED Screen">
    <img src="img/smartpole/motion.jpg" class="product-image" alt="Motion Detector">
    <img src="img/smartpole/wifi.jpg" class="product-image" alt="Wi-Fi Hotspot">
    <img src="img/smartpole/intercom.jpg" class="product-image" alt="Intercom">
    <img src="img/smartpole/touch-screen.jpg" class="product-image" alt="Android Touch Screen">
    <img src="img/smartpole/voice.jpg" class="product-image" alt="AI-Based Voice Communication">
    <img src="img/smartpole/camera.jpg" class="product-image" alt="AI-Based Camera">
  </div>
</section>

<script>
// Data for features
const features = [
  {name:"EV Charger", desc:"Fast, efficient EV charging; solar/wind integration and QR payments."},
  {name:"Emergency SOS Alert", desc:"Instant SOS with GPS, voice/push activation and ICCC integration."},
  {name:"Wired Charging", desc:"Weatherproof, safe plug-and-charge with real-time power & metering."},
  {name:"Wireless Charging", desc:"Contactless EV charging for convenient public/fleet use."},
  {name:"Air Quality Sensor", desc:"Real-time PM/CO₂/NO₂ monitoring with IoT reporting and alerts."},
  {name:"Air Quality Screen", desc:"Outdoor AQI display with auto-brightness and public alerts."},
  {name:"Street Lighting", desc:"Smart dimmable LEDs with motion, schedules and solar option."},
  {name:"PA Loudspeaker", desc:"Weatherproof public address for alerts, announcements and events."},
  {name:"Power Generation System", desc:"Solar/wind hybrid generation with battery storage."},
  {name:"RGB Pixel LED Screen", desc:"High-bright dynamic display for ads, alerts and info."},
  {name:"Motion Detector", desc:"Day/night movement detection that triggers lights/cameras."},
  {name:"Wi-Fi Hotspot", desc:"Public broadband access and IoT connectivity with secure access."},
  {name:"Intercom", desc:"Two-way citizen ↔ control center communication (audio/video)."},
  {name:"Android Touch Screen", desc:"Outdoor info kiosk: maps, tickets, navigation & services."},
  {name:"AI-Based Voice Communication", desc:"Multilingual voice assistant for info and commands."},
  {name:"AI-Based Camera", desc:"Smart video analytics (detection, ANPR, alerts) with edge/cloud support."},
];

const featuresContainer = document.getElementById('features');
const images = document.querySelectorAll('.product-image');

// Create feature elements dynamically
features.forEach((f, i) => {
  const div = document.createElement('div');
  div.classList.add('feature');
  if (i === 0) div.classList.add('active');
  div.innerHTML = `
    ${f.name}
    <div class="feature-desc">${f.desc}</div>
  `;
  div.addEventListener('click', () => {
    document.querySelectorAll('.feature').forEach(el => el.classList.remove('active'));
    div.classList.add('active');

    images.forEach((img, idx) => {
      img.classList.toggle('active', idx === i);
    });
  });
  featuresContainer.appendChild(div);
});
</script>

</body>
</html>
