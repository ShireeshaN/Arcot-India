<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Energy Desktop — Zoom & Mobile Scroll</title>
  <style>
    :root{
      --viewer-w: 720px;
      --viewer-h: 420px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      height:100vh; width:100vw; overflow:hidden;
      background:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1920&auto=format&fit=crop") center/cover no-repeat fixed;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color:#fff;
      animation: zoomBg 18s ease-in-out infinite alternate;
    }

    /* 🔍 Smooth zoom effect for desktop */
    @keyframes zoomBg {
      0% { background-size: 100%; }
      100% { background-size: 110%; }
    }

    .top-bar{
      position:fixed; inset:0 0 auto 0;
      display:flex; justify-content:center; gap:22px;
      padding:16px 20px;
      background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.15) 70%, transparent);
      backdrop-filter:saturate(1.2) blur(6px);
      border-bottom:1px solid rgba(255,255,255,.12);
      z-index:50;
      overflow-x:auto;   /* ✅ makes it scrollable on mobile */
      scrollbar-width:none; /* hide scrollbar Firefox */
    }
    .top-bar::-webkit-scrollbar{ display:none; } /* hide scrollbar Chrome */

    .icon{
      position:relative; width:78px; flex-shrink:0; /* ✅ prevents icons from shrinking */
      text-align:center; cursor:pointer; user-select:none;
      transition:transform .18s ease;
    }
    .icon:hover{ transform:scale(1.08) }
    .thumb{
      width:78px; height:78px; border-radius:18px; overflow:hidden;
      box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block }
    .label{ display:block; margin-top:6px; font-size:12px; opacity:.9 }

    .viewer{
      position:fixed; left:50%; top:52%;
      width:var(--viewer-w); height:var(--viewer-h);
      transform:translate(-50%,-50%);
      background:#000; border-radius:18px; overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08) inset;
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity .35s ease;
      z-index:40;
      margin-top:70px;
    }
    .viewer.active{ opacity:1; pointer-events:auto }
    .viewer img{ width:100%; height:100%; object-fit:cover; }
    .viewer .x{
      position:absolute; top:10px; right:10px;
      width:30px; height:30px; border-radius:50%;
      background:#ff3b30; border:none; color:#fff; font-size:18px; cursor:pointer;
      box-shadow:0 8px 24px rgba(0,0,0,.5);
    }

    /* 📱 Mobile adjustments */
    @media (max-width: 768px) {
      :root{
        --viewer-w: 90vw;
        --viewer-h: 55vh;
      }
      body{
        background-attachment:scroll; /* prevent weird fixed bg on mobile */
      }
      .viewer img{
        object-fit:contain; /* ✅ make image fit inside viewer */
        background:#000;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar" id="topBar">
    <div class="icon" data-img="https://images.unsplash.com/photo-1509395176047-4a66953fd231?q=80&w=1600">
      <div class="thumb"><img src="https://images.unsplash.com/photo-1509395176047-4a66953fd231?q=80&w=240" alt=""></div>
      <span class="label">Solar</span>
    </div>

    <div class="icon" data-img="https://images.unsplash.com/photo-1501630834273-4b5604d2ee31?q=80&w=1600">
      <div class="thumb"><img src="https://images.unsplash.com/photo-1501630834273-4b5604d2ee31?q=80&w=240" alt=""></div>
      <span class="label">Wind</span>
    </div>

    <div class="icon" data-img="https://images.unsplash.com/photo-1603933225640-1b4b76ac49d0?q=80&w=1600">
      <div class="thumb"><img src="https://images.unsplash.com/photo-1603933225640-1b4b76ac49d0?q=80&w=240" alt=""></div>
      <span class="label">Biomass</span>
    </div>

    <div class="icon" data-img="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=1600">
      <div class="thumb"><img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=240" alt=""></div>
      <span class="label">Hydel</span>
    </div>

    <div class="icon" data-img="https://images.unsplash.com/photo-1496568816309-51d7c20e3b21?q=80&w=1600">
      <div class="thumb"><img src="https://images.unsplash.com/photo-1496568816309-51d7c20e3b21?q=80&w=240" alt=""></div>
      <span class="label">Geothermal</span>
    </div>

    <div class="icon" data-img="https://images.unsplash.com/photo-1505236731920-7738c4eaf2b0?q=80&w=1600">
      <div class="thumb"><img src="https://images.unsplash.com/photo-1505236731920-7738c4eaf2b0?q=80&w=240" alt=""></div>
      <span class="label">Tidal</span>
    </div>

    <div class="icon" data-img="https://images.unsplash.com/photo-1535979861598-8a5f53bfe2df?q=80&w=1600">
      <div class="thumb"><img src="https://images.unsplash.com/photo-1535979861598-8a5f53bfe2df?q=80&w=240" alt=""></div>
      <span class="label">Hydrogen</span>
    </div>

    <div class="icon" data-img="https://images.unsplash.com/photo-1498598453630-dcbf7a3a06d1?q=80&w=1600">
      <div class="thumb"><img src="https://images.unsplash.com/photo-1498598453630-dcbf7a3a06d1?q=80&w=240" alt=""></div>
      <span class="label">Microgrid</span>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <button class="x" id="viewerClose">&times;</button>
    <img id="viewerImg" src="" alt="">
  </div>

  <script>
    const topBar = document.getElementById('topBar');
    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewerImg');
    const viewerClose = document.getElementById('viewerClose');

    let icons = Array.from(document.querySelectorAll('.icon'));
    let current = 0;
    let timer = null;

    function showFromIcon(iconEl){
      if(!iconEl) return;
      const src = iconEl.getAttribute('data-img');
      viewerImg.src = src;
      viewer.classList.add('active');
    }

    function nextAuto(){
      if(icons.length === 0){ viewer.classList.remove('active'); clearInterval(timer); return; }
      current = current % icons.length;
      showFromIcon(icons[current]);
      current = (current + 1) % icons.length;
    }

    function startAuto(){
      if(timer) clearInterval(timer);
      nextAuto();
      timer = setInterval(nextAuto, 4000);
    }

    topBar.addEventListener('click', (e)=>{
      const icon = e.target.closest('.icon');
      if(!icon) return;
      clearInterval(timer);
      showFromIcon(icon);
      current = icons.indexOf(icon) + 1;
      startAuto();
    });

    viewerClose.addEventListener('click', ()=>{
      viewer.classList.remove('active'); // simple fade out
    });

    startAuto();
  </script>
</body>
</html>
