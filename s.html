<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transmission Lines Highlights</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .image-container {
            position: relative;
            display: inline-block;
            max-width: 90%;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border: 2px solid #fff;
        }

        .highlight {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .highlight:hover {
            transform: scale(1.5);
        }

        .label {
            position: absolute;
            background: #fff;
            color: #000;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .highlight:hover + .label {
            opacity: 1;
        }

        /* Specific coordinates based on your image */
        .voltage {
            top: 18%;
            left: 12%;
        }
        .voltage-label {
            top: 16%;
            left: 14%;
        }

        .capacitor {
            top: 42%;
            left: 68%;
        }
        .capacitor-label {
            top: 44%;
            left: 70%;
        }

        .insulators {
            top: 28%;
            left: 52%;
        }
        .insulators-label {
            top: 26%;
            left: 54%;
        }

        .cables {
            top: 65%;
            left: 22%;
        }
        .cables-label {
            top: 63%;
            left: 24%;
        }

        .conductors {
            top: 35%;
            left: 60%;
        }
        .conductors-label {
            top: 33%;
            left: 62%;
        }

        .towers {
            top: 38%;
            left: 32%;
        }
        .towers-label {
            top: 36%;
            left: 34%;
        }

    </style>
</head>
<body>

    <h1>Transmission Lines - Key Components</h1>

    <div class="image-container">
        <img src="img/transmission-lines/transmission-lines.png" alt="Transmission Lines" />

        <!-- Highlights and labels -->
        <div class="highlight voltage"></div>
        <div class="label voltage-label">Voltage</div>

        <div class="highlight capacitor"></div>
        <div class="label capacitor-label">Capacitor</div>

        <div class="highlight insulators"></div>
        <div class="label insulators-label">Insulators</div>

        <div class="highlight cables"></div>
        <div class="label cables-label">Cables</div>

        <div class="highlight conductors"></div>
        <div class="label conductors-label">Conductors</div>

        <div class="highlight towers"></div>
        <div class="label towers-label">Towers</div>
    </div>

</body>
</html>
