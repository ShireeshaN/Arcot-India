<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Testimonials</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #fff;
      color: #333;
    }
    .testimonial-container {
      display: flex;
      max-width: 1200px;
      margin: auto;
      gap: 40px;
      align-items: start;
    }
    .text-area {
      flex: 1;
    }
    .text-area h2 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .text-area p {
      font-size: 18px;
      margin-bottom: 15px;
      line-height: 1.8;
    }
    .text-area .author {
      font-weight: bold;
    }
    .dots {
      margin-top: 20px;
    }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #bbb;
      border-radius: 50%;
      margin: 0 5px;
      cursor: pointer;
    }
    .dot.active {
      background: red;
    }
    .image-area {
      flex: 1;
      display: grid;
      grid-template-areas: 
        "img1 img2"
        "img1 img3";
      gap: 20px;
    }
    .image-area img {
      
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .img1 {
      grid-area: img1;
      border-radius: 90px 0 90px 0px;
      width: 100%;
      height: 100%;

    }
    .img2 {
        width: 100%;
      height: auto;
      grid-area: img2;
      border-radius: 90px 0 0 0;
    }
    .img3 {
        width: 100%;
      height: auto;
      grid-area: img3;
      border-radius: 0 0 90px 0;
    }
    .image-area img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div class="testimonial-container">
  <div class="text-area">
    <h2 id="testimonial-title">Our Customer First Approach Wins Hearts, Always.</h2>
    <p id="testimonial-desc">That’s what the complete home automation solution should be. Got everything at one place. Very much satisfied about how things came about. Thanks to the team.</p>
    <div class="author" id="testimonial-author">– Sreedhar Ganduri</div>
    <div class="dots">
      <span class="dot active" data-index="0"></span>
      <span class="dot" data-index="1"></span>
      <span class="dot" data-index="2"></span>
    </div>
  </div>
  <div class="image-area">
    <img src="img/abouimg/feature-1 (1).png" class="img1" alt="Image 1">
    <img src="img/abouimg/feature-1 (1).png" class="img2" alt="Image 2">
    <img src="img/abouimg/feature-1 (1).png" class="img3" alt="Image 3">
  </div>
</div>

<script>
  const testimonials = [
    {
      title: "Our Customer First Approach Wins Hearts, Always.",
      desc: "That’s what the complete home automation solution should be. Got everything at one place. Very much satisfied about how things came about. Thanks to the team.",
      author: "– Sreedhar Ganduri",
      images: [
        "img/abouimg/feature-1 (1).png",
        "img/abouimg/feature-1 (1).png",
        "img/abouimg/feature-1 (1).png"
      ]
    },
    {
      title: "Quality and Service You Can Trust.",
      desc: "The team provided expert solutions tailored to our business needs. Their efficiency and professionalism were unmatched.",
      author: "– Priya, Mumbai",
      images: [
        "img/abouimg/feature-1 (1).png",
        "img/abouimg/feature-1 (1).png",
        "img/abouimg/feature-1 (1).png"
      ]
    },
    {
      title: "Innovative Solutions That Work.",
      desc: "Thanks to this team for transforming our space into something beyond imagination. Their support and solutions were outstanding.",
      author: "– Rohit, Delhi",
      images: [
        "img/abouimg/feature-1 (1).png",
        "img/abouimg/feature-1 (1).png",
        "img/abouimg/feature-1 (1).png"
      ]
    }
  ];

  const title = document.getElementById("testimonial-title");
  const desc = document.getElementById("testimonial-desc");
  const author = document.getElementById("testimonial-author");
  const img1 = document.querySelector(".img1");
  const img2 = document.querySelector(".img2");
  const img3 = document.querySelector(".img3");
  const dots = document.querySelectorAll(".dot");

  let currentIndex = 0;

  function showTestimonial(index) {
    const data = testimonials[index];
    title.textContent = data.title;
    desc.textContent = data.desc;
    author.textContent = data.author;
    img1.src = data.images[0];
    img2.src = data.images[1];
    img3.src = data.images[2];
    dots.forEach(dot => dot.classList.remove("active"));
    dots[index].classList.add("active");
  }

  dots.forEach(dot => {
    dot.addEventListener("click", () => {
      currentIndex = parseInt(dot.getAttribute("data-index"));
      showTestimonial(currentIndex);
    });
  });

  setInterval(() => {
    currentIndex = (currentIndex + 1) % testimonials.length;
    showTestimonial(currentIndex);
  }, 5000);

  showTestimonial(0);
</script>

</body>
</html>
