<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interior Design Layout</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color: #3c3c3c;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Outer wrapper */
    .layout-container {
      position: relative;
      width: 90%;
      max-width: 1300px;
      height: 85vh;
      background-color: #1f1f1f;
      display: flex;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    /* Marble background */
    .marble-bg {
      position: absolute;
      top: -40px;
      left: -40px;
      width: 50%;
      height: 100%;
      background: url("https://images.unsplash.com/photo-1584969266449-499cca5557f1?auto=format&fit=crop&w=800&q=80")
        no-repeat center/cover;
      z-index: 1;
      opacity: 0.9;
      transform: rotate(-1deg);
    }

    .left-panel {
      position: relative;
      z-index: 2;
      width: 45%;
      background-color: #2b2b2b;
      overflow: hidden;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-left: 60px;
    }

    .left-panel img {
  width: calc(100% - 50px);
  height: 100%;
  object-fit: cover;
  opacity: 0.95;
  transform: scale(1);
  transition: transform 2s ease-in-out, opacity 0.6s ease;
}
.left-panel img:hover {
  transform: scale(1.05);
}


    /* Vertical Menu */
    .vertical-nav {
      position: absolute;
      left: 30px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .vertical-nav a {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #bbb;
      font-size: 10px;
      letter-spacing: 2px;
      text-decoration: none;
      font-weight: 400;
      transition: color 0.3s ease;
    }

    .vertical-nav a:hover {
      color: #fff;
    }

    /* Right panel */
    .right-panel {
      width: 55%;
      background-color: #1c1c1c;
      padding: 80px 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .right-panel h1 {
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .right-panel p {
      color: #aaa;
      font-size: 0.95rem;
      line-height: 1.8;
      margin-bottom: 30px;
      max-width: 350px;
    }

    .btn-outline-light {
      border-radius: 0;
      border: 1px solid #fff;
      padding: 10px 25px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      width: fit-content;
    }

    .btn-outline-light:hover {
      background-color: #fff;
      color: #111;
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: absolute;
      right: 50px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #aaa;
      cursor: pointer;
    }

    .scroll-indicator .line {
      width: 1px;
      height: 60px;
      background-color: #777;
      margin: 5px 0;
      opacity: 0.8;
    }

    .scroll-indicator .arrow-down {
      width: 8px;
      height: 8px;
      border-left: 1px solid #777;
      border-bottom: 1px solid #777;
      transform: rotate(-45deg);
      margin-top: 5px;
      opacity: 0.8;
    }

    /* Socials */
    .socials {
      position: absolute;
      right: 50px;
      bottom: 30px;
      display: flex;
      gap: 20px;
    }

    .socials a {
      color: #aaa;
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .socials a:hover {
      color: #fff;
    }

    /* Background big text */
    .background-text {
      position: absolute;
      left: -70px;
      top: 0;
      font-size: 8rem;
      color: rgba(255, 255, 255, 0.05);
      font-weight: 700;
      letter-spacing: 5px;
      transform: rotate(-90deg);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
/* ===========================
   RESPONSIVE MEDIA QUERIES
   =========================== */

/* ---------- Tablets (≤992px) ---------- */
@media (max-width: 992px) {
  body {
    height: auto;
    overflow-y: auto;
    background-color: #1f1f1f;
  }

  .layout-container {
    flex-direction: column;
    height: auto;
    width: 95%;
    margin: 40px auto;
  }

  .left-panel,
  .right-panel {
    width: 100%;
    height: auto;
    padding: 40px 30px;
  }

  /* Hide vertical nav */
  .vertical-nav {
    display: none !important;
  }

  /* Image section first */
  .left-panel {
    order: 1;
    justify-content: center;
    padding: 0 30px; /* 🟢 added padding left & right */
  }

  .left-panel img {
    width: 100%;
    height: 60vh;
    object-fit: cover;
    display: block;
    border-radius: 10px; /* optional soft rounded edges */
  }

  /* Right panel second */
  .right-panel {
    order: 2;
    padding: 60px 40px;
    text-align: center;
    align-items: center;
  }

  .right-panel h1 {
    font-size: 2rem;
    line-height: 1.3;
    margin-bottom: 15px;
  }

  .right-panel p {
    font-size: 1rem;
    max-width: 90%;
    margin: 0 auto 25px;
  }

  .btn-outline-light {
    padding: 12px 30px;
    font-size: 0.95rem;
  }

  /* Scroll indicator */
  .scroll-indicator {
    position: static;
    flex-direction: row;
    gap: 12px;
    justify-content: center;
    margin-top: 30px;
  }

  .scroll-indicator .line {
    height: 1px;
    width: 40px;
  }

  .scroll-indicator .arrow-down {
    transform: rotate(45deg);
    border-color: #aaa;
  }

  /* Socials */
  .socials {
    position: static;
    justify-content: center;
    margin-top: 30px;
  }

  .marble-bg {
    display: none;
  }
}

/* ---------- Mobile (≤768px) ---------- */
@media (max-width: 768px) {
  .left-panel {
    padding: 0 20px; /* 🟢 smaller padding for mobile */
  }

  .left-panel img {
    height: 50vh;
    border-radius: 8px;
  }

  .right-panel h1 {
    font-size: 1.6rem;
  }

  .right-panel p {
    font-size: 0.9rem;
  }

  .background-text {
    font-size: 4rem;
  }

  .btn-outline-light {
    font-size: 0.85rem;
    padding: 10px 22px;
  }

  .scroll-indicator {
    font-size: 10px;
  }

  .socials a {
    font-size: 0.8rem;
  }

  .vertical-nav {
    display: none !important;
  }
}

/* ---------- Small Phones (≤480px) ---------- */
@media (max-width: 480px) {
  .layout-container {
    width: 100%;
    box-shadow: none;
    height: auto;
  }

  .left-panel {
    padding: 0 15px; /* 🟢 tighter padding for very small screens */
  }

  .left-panel img {
    height: 40vh;
    border-radius: 6px;
  }

  .right-panel {
    padding: 40px 20px;
  }

  .right-panel h1 {
    font-size: 1.4rem;
  }

  .right-panel p {
    font-size: 0.85rem;
  }

  .background-text {
    font-size: 3rem;
    opacity: 0.05;
  }

  .btn-outline-light {
    padding: 8px 18px;
    font-size: 0.8rem;
  }

  .scroll-indicator {
    gap: 8px;
  }

  .vertical-nav {
    display: none !important;
  }
}


  </style>
</head>

<body>
  <div class="layout-container">
    <div class="marble-bg"></div>

    <!-- Left Section -->
    <div class="left-panel">
      <nav class="vertical-nav">
        <a href="#">Home</a>
        <a href="#">Our Projects</a>
        <a href="#">Our Services</a>
        <a href="#">Home Works</a>
        <a href="#">Contact Us</a>
      </nav>
      <img src="../img/automation/animation background.jpg" alt="Interior Design" />
    </div>

    <!-- Right Section -->
    <div class="right-panel">
      <div class="background-text">STYLISH</div>
      <h1>Innovative ideas,<br />stylish designs</h1>
      <p>Interior design services for home & business</p>
      <button class="btn btn-outline-light">Book Consultation</button>

      <div class="scroll-indicator" id="nextSlide">
        <span>01</span>
        <div class="line"></div>
        <span>05</span>
        <div class="arrow-down"></div>
      </div>

      <div class="socials">
        <a href="#">FB</a>
        <a href="#">IG</a>
        <a href="#">TW</a>
      </div>
    </div>
  </div>
<script>
  const slides = [
    {
      image: "../img/automation/hospitalautomation.png",
      bgText: "STYLISH",
      title: "Innovative ideas,<br>stylish designs",
      text: "Interior design services for home & business"
    },
    {
      image: "../img/automation/hospitalautomation.png",
      bgText: "MODERN",
      title: "Where style meets comfort",
      text: "Bringing elegance and modern design together."
    },
    {
      image: "../img/automation/hospitalautomation.png",
      bgText: "ELEGANT",
      title: "Crafted with passion",
      text: "Designs that reflect your unique lifestyle."
    },
    {
      image: "../img/automation/hospitalautomation.png",
      bgText: "CREATIVE",
      title: "Transforming spaces",
      text: "From minimal to bold, we make it yours."
    },
    {
      image: "../img/automation/hospitalautomation.png",
      bgText: "LUXURY",
      title: "Design beyond imagination",
      text: "Luxury interiors designed to inspire."
    }
  ];

  let currentSlide = 0;
  const imgEl = document.querySelector(".left-panel img");
  const bgTextEl = document.querySelector(".background-text");
  const titleEl = document.querySelector(".right-panel h1");
  const textEl = document.querySelector(".right-panel p");
  const arrowEl = document.querySelector(".arrow-down");

  // Show slide function
  function showSlide(index) {
    const slide = slides[index];

    // Fade out
    imgEl.style.opacity = 0;
    titleEl.style.opacity = 0;
    textEl.style.opacity = 0;
    bgTextEl.style.opacity = 0;

    setTimeout(() => {
      imgEl.src = slide.image;
      bgTextEl.textContent = slide.bgText;
      titleEl.innerHTML = slide.title;
      textEl.textContent = slide.text;

      // Fade in
      imgEl.style.opacity = 1;
      titleEl.style.opacity = 1;
      textEl.style.opacity = 1;
      bgTextEl.style.opacity = 0.05;
    }, 400);
  }

  // Arrow click to go to next slide
  arrowEl.addEventListener("click", () => {
    currentSlide = (currentSlide + 1) % slides.length;
    showSlide(currentSlide);
  });

  // Auto slide every 5 seconds
  setInterval(() => {
    currentSlide = (currentSlide + 1) % slides.length;
    showSlide(currentSlide);
  }, 5000);

  // Initialize first slide
  showSlide(currentSlide);
</script>



</body>
</html>
