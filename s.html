<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process Flow Animation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      padding: 50px;
      text-align: center;
    }

    .timeline {
      position: relative;
      max-width: 1200px;
      margin: auto;
    }

    /* Background gray bar */
    .timeline::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      height: 20px;
      width: 100%;
      background: #e0e0e0;
      transform: translateY(-50%);
      border-radius: 10px;
    }

    /* Animated overlay bar */
    .progress-bar {
      position: absolute;
      top: 50%;
      left: 0;
      height: 20px;
      background: linear-gradient(90deg, #999, #ccc);
      border-radius: 10px;
      transform: translateY(-50%);
      width: 0;
      animation: progress 12s linear infinite;
    }

    @keyframes progress {
      0% { width: 0; }
      100% { width: 100%; }
    }

    /* Steps */
    .steps {
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .step {
      text-align: center;
      opacity: 0.2;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .step.active {
      opacity: 1;
      transform: scale(1.1);
    }

    .step img {
      width: 40px;
      margin-bottom: 10px;
    }

    .step .box {
      display: inline-block;
      padding: 8px 16px;
      background: #888;
      color: #fff;
      border-radius: 6px;
      margin-top: 5px;
      font-size: 14px;
    }

    /* Caption under */
    .caption {
      margin-top: 40px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="timeline">
    <div class="progress-bar" id="progress"></div>
    <div class="steps">
      <div class="step" data-step="0">
        <img src="https://img.icons8.com/ios/50/000000/user.png" alt="">
        <div>Submitter</div>
        <div class="box">Invoice Submitted</div>
      </div>
      <div class="step" data-step="1">
        <img src="https://img.icons8.com/ios/50/000000/user.png" alt="">
        <div>Analyst Verification</div>
        <div class="box">Invoice Processing</div>
      </div>
      <div class="step" data-step="2">
        <img src="https://img.icons8.com/ios/50/000000/user.png" alt="">
        <div>Discrepancy Handling</div>
        <div class="box">Routing</div>
      </div>
      <div class="step" data-step="3">
        <img src="https://img.icons8.com/ios/50/000000/user.png" alt="">
        <div>Approval</div>
        <div class="box">API Vendor Response</div>
      </div>
      <div class="step" data-step="4">
        <img src="https://img.icons8.com/ios/50/000000/user.png" alt="">
        <div>Payment Processing</div>
        <div class="box">Final Payment</div>
      </div>
    </div>
  </div>

  <div class="caption">Time & Cost → 2 Weeks</div>

  <script>
    const steps = document.querySelectorAll(".step");
    let currentStep = 0;

    function highlightSteps() {
      steps.forEach((step, index) => {
        step.classList.remove("active");
        if (index === currentStep) {
          step.classList.add("active");
        }
      });

      currentStep++;
      if (currentStep >= steps.length) {
        currentStep = 0;
      }
    }

    // Animate each step one by one in sync with progress bar
    setInterval(highlightSteps, 2400); // 12s / 5 steps = 2.4s each
  </script>

</body>
</html>
