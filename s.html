<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Hotspot Product Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 1500px;
      overflow: hidden;
    }

    .main-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    /* Each hotspot (+ symbol) */
    .hotspot {
      position: absolute;
      width: 35px;
      height: 35px;
      background-color: white;
      color: #000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .hotspot:hover {
      transform: scale(1.2);
    }

    /* Product popup (hidden initially) */
    .product-popup {
      position: absolute;
      background-color: #fff;
      border-radius: 5px;
      padding: 15px;
      width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
      pointer-events: none;
      z-index: 5;
    }

    .product-popup img {
      width: 100%;
      max-width: 130px;
      height: auto;
    }

    .product-popup p {
      font-size: 0.9rem;
      color: #333;
      font-weight: 600;
      margin-top: 8px;
    }

    /* Hover effect to show popup */
    .hotspot:hover .product-popup {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    /* Position each hotspot manually */
    .hotspot1 {
      top: 25%;
      left: 40%;
    }

    .hotspot2 {
      top: 50%;
      left: 30%;
    }

    .hotspot3 {
      top: 65%;
      left: 55%;
    }

    .hotspot4 {
      top: 40%;
      left: 75%;
    }

    /* Adjust popup positions relative to each hotspot */
    .hotspot .product-popup {
      top: -220%;
      left: 50%;
      transform: translate(-50%, 0);
    }

    @media (max-width: 768px) {
      .hotspot {
        width: 28px;
        height: 28px;
        font-size: 18px;
      }
      .product-popup {
        width: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Background image -->
    <img src="img/r&d_bannerimage.jpg" alt="Modern House" class="main-image" />

    <!-- Hotspot 1 -->
    <div class="hotspot hotspot1">
      +
      <div class="product-popup">
        <img src="img/14.png" alt="LW-SL-622" />
        <p>LW-SL-622 WASHROOMS</p>
      </div>
    </div>

    <!-- Hotspot 2 -->
    <div class="hotspot hotspot2">
      +
      <div class="product-popup">
        <img src="light2.png" alt="LW-DL-331" />
        <p>LW-DL-331 LIVING ROOM</p>
      </div>
    </div>

    <!-- Hotspot 3 -->
    <div class="hotspot hotspot3">
      +
      <div class="product-popup">
        <img src="light3.png" alt="LW-PL-119" />
        <p>LW-PL-119 KITCHEN</p>
      </div>
    </div>

    <!-- Hotspot 4 -->
    <div class="hotspot hotspot4">
      +
      <div class="product-popup">
        <img src="light4.png" alt="LW-WL-701" />
        <p>LW-WL-701 BEDROOM</p>
      </div>
    </div>
  </div>
</body>
</html>
